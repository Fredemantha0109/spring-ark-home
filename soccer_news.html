<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer News — Spring Ark</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Shippori+Mincho:wght@400;500;600&display=swap');

:root {
  --bg: #0c0c0e;
  --surface: #111114;
  --surface2: #18181d;
  --border: #222228;
  --border-bright: #2e2e38;
  --accent: #a8ff78;
  --accent-dim: #4a7a38;
  --accent2: #78c8ff;
  --accent3: #ffb878;
  --text: #dddde8;
  --text-muted: #888899;
  --text-dim: #444455;
  --radius: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Shippori Mincho', serif; font-size: 19px; }

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 9999; opacity: 0.4;
}

.shell {
  display: grid;
  grid-template-rows: 52px 1fr;
  grid-template-columns: 260px 1fr;
  height: 100vh;
}

.topbar {
  grid-column: 1 / -1;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 22px;
}
.logo { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; letter-spacing: 0.2em; color: var(--accent); }
.topbar-sub { font-family: 'DM Mono', monospace; font-size: 15px; color: var(--text-muted); }
.back-btn {
  margin-left: auto; font-family: 'DM Mono', monospace; font-size: 14px; color: var(--text-muted);
  text-decoration: none; border: 1px solid var(--border-bright); padding: 6px 14px;
  border-radius: 4px; letter-spacing: 0.08em; transition: all 0.15s;
}
.back-btn:hover { color: var(--accent2); border-color: var(--accent2); }

/* ARCHIVE SIDEBAR */
.sidebar {
  grid-row: 2; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-inner { flex: 1; overflow-y: auto; padding: 16px 12px; }
.sidebar-inner::-webkit-scrollbar { width: 3px; }
.sidebar-inner::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
.section-label {
  font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.2em;
  color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; padding: 0 4px;
}
.archive-item {
  font-family: 'DM Mono', monospace; font-size: 15px; color: var(--text-muted);
  padding: 9px 10px; border-radius: 5px; cursor: pointer; transition: all 0.12s;
  letter-spacing: 0.02em; margin-bottom: 2px;
  display: flex; align-items: center; gap: 8px;
}
.archive-item:hover { background: var(--surface2); color: var(--text); }
.archive-item.active { background: var(--surface2); color: var(--accent); border-left: 2px solid var(--accent); padding-left: 8px; }
.archive-unread-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent3); flex-shrink: 0;
}

/* MAIN CONTENT */
.content { grid-row: 2; overflow-y: auto; overflow-x: hidden; padding: 16px; padding-bottom: 90px; }
.content::-webkit-scrollbar { width: 3px; }
.content::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
.content-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.updated-line { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text-dim); text-align: right; }

.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden;
}
.panel-header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 9px; }
.panel-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.panel-dot.orange { background: var(--accent3); }
.panel-dot.blue { background: var(--accent2); }
.panel-title { font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.15em; color: var(--text-muted); text-transform: uppercase; }
.panel-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

.empty-note { font-family: 'DM Mono', monospace; font-size: 15px; color: var(--text-dim); padding: 4px 2px; }

/* MATCH RESULT SPOILER */
.match-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 14px;
}
.match-teaser {
  display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  user-select: none;
}
.match-teaser-text { font-size: 17px; color: var(--text); }
.match-teaser-hint { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent2); letter-spacing: 0.05em; }
.match-detail {
  display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-bright);
  font-size: 17px; line-height: 1.7;
}
.match-detail.show { display: block; }
.match-detail .score { font-family: 'DM Mono', monospace; font-size: 19px; color: var(--accent); }
.match-detail .meta { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text-muted); margin-top: 4px; }

/* STANDINGS */
table.standings { width: 100%; border-collapse: collapse; font-size: 16px; }
table.standings th, table.standings td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
table.standings th { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: var(--text-muted); text-transform: uppercase; }
table.standings td.num { font-family: 'DM Mono', monospace; text-align: center; }

/* TRANSFER / GOAL ITEMS */
.list-item {
  padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 5px;
  font-size: 16px; line-height: 1.5;
}

/* TEAM / PLAYER NAME HIGHLIGHTS */
.team-name { color: var(--accent2); font-weight: 600; }
.player-name { color: var(--accent3); font-weight: 600; }

/* CHAT DOCK */
.chat-dock {
  position: fixed; left: 260px; right: 0; bottom: 0; z-index: 100;
  background: var(--surface); border-top: 1px solid var(--border-bright);
  display: flex; flex-direction: column;
  box-shadow: 0 -8px 24px rgba(0,0,0,0.35);
}
.chat-messages {
  display: none; flex-direction: column; gap: 10px;
  max-height: 320px; overflow-y: auto; padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.chat-messages.show { display: flex; }
.chat-messages::-webkit-scrollbar { width: 3px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
.chat-msg { max-width: 74%; font-size: 16px; line-height: 1.65; padding: 9px 12px; border-radius: 8px; white-space: pre-wrap; }
.chat-msg.user { align-self: flex-end; background: var(--accent-dim); color: #eafff0; border-bottom-right-radius: 2px; }
.chat-msg.assistant { align-self: flex-start; background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
.chat-msg.pending { color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 13px; }
.chat-sources { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
.chat-sources a { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent2); text-decoration: none; word-break: break-all; }
.chat-sources a:hover { text-decoration: underline; }
.chat-input-row { display: flex; align-items: center; gap: 10px; padding: 12px 18px; }
.chat-label { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; flex-shrink: 0; }
.chat-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
  padding: 10px 16px; color: var(--text); font-size: 16px; font-family: 'Shippori Mincho', serif;
  outline: none; transition: border-color 0.15s;
}
.chat-input:focus { border-color: var(--accent-dim); }
.chat-input::placeholder { color: var(--text-dim); }
.chat-send-btn {
  background: var(--accent); color: var(--bg); border: none; border-radius: 20px;
  padding: 10px 18px; font-family: 'DM Mono', monospace; font-size: 14px; letter-spacing: 0.05em;
  cursor: pointer; flex-shrink: 0; transition: opacity 0.15s;
}
.chat-send-btn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>

</div>

    "resultsHtml": "<div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">アーセナル</span>と<span class=\"team-name\">マンチェスター・シティ</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">アーセナル</span> 3 - 0 <span class=\"team-name\">マンチェスター・シティ</span></div><div>シーズン最初のタイトルを懸けたイングランド・スーパーカップ。<span class=\"team-name\">アーセナル</span>は立ち上がりわずか24秒、<span class=\"player-name\">マイルズ・ルイス=スケリー</span>のパスをペナルティエリア手前で受けた<span class=\"player-name\">リカルド・カラフィオーリ</span>が左隅へ流し込んで電撃先制。前半29分には<span class=\"player-name\">マルティン・ウーデゴール</span>のクロスを<span class=\"player-name\">クリストス・ツォリス</span>が折り返し、<span class=\"player-name\">カイ・ハフェルツ</span>が押し込んで2点目を奪った。<span class=\"team-name\">マンチェスター・シティ</span>は新指揮官エンツォ・マレスカの公式戦デビュー戦だったが、<span class=\"player-name\">アーリング・ハーランド</span>が再三決定機を迎えながら<span class=\"player-name\">ダビド・ラヤ</span>の好守に阻まれ、<span class=\"player-name\">フィル・フォーデン</span>や<span class=\"player-name\">アントワーヌ・セメンヨ</span>の枠内シュートもゴールを割れなかった。後半3分にはキャプテン<span class=\"player-name\">マルティン・ウーデゴール</span>が<span class=\"player-name\">ジョシュコ・グバルディオル</span>と<span class=\"player-name\">ジャンルイジ・ドンナルンマ</span>をかわして無人のゴールへ流し込み3-0。<span class=\"team-name\">アーセナル</span>は3年で2度目のコミュニティ・シールド制覇となり、プレミアリーグ王者として最高の船出を切った。今夏加入の<span class=\"player-name\">ブルーノ・ギマラエス</span>は初の公式戦でスタメン出場している。</div><div class=\"meta\">FAコミュニティ・シールド 2026 ／ 2026年8月16日 15:00 KO(現地時間) ／ プリンシパリティ・スタジアム(カーディフ) ／ 得点: <span class=\"player-name\">リカルド・カラフィオーリ</span>1分、<span class=\"player-name\">カイ・ハフェルツ</span>29分、<span class=\"player-name\">マルティン・ウーデゴール</span>48分 ／ マン・オブ・ザ・マッチ: <span class=\"player-name\">マルティン・ウーデゴール</span></div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">レアル・マドリード</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</     "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">トッテナム・ホットスパー</span> → <span class=\"team-name\">アトレティコ・マドリード</span>：DF<span class=\"player-name\">クリスティアン・ロメロ</span>(28歳・アルゼンチン代表)の完全移籍が正式発表された。移籍金は約4,000万ユーロ。<span class=\"team-name\">トッテナム・ホットスパー</span>でキャプテンを務めた実績あるセンターバックがディエゴ・シメオネ監督の守備陣に加わる。</div><div class=\"list-item\"><span class=\"team-name\">バルセロナ</span> → <span class=\"team-name\">パリ・サンジェルマン</span>：FW<span class=\"player-name\">フェラン・トーレス</span>(26歳・スペイン代表)の完全移籍が正式発表。移籍金は約5,000万ユーロで、<span class=\"team-name\">バルセロナ</span>はこの売却により<span class=\"player-name\">ロドリ</span>(30歳・スペイン代表)獲得へ資金的な目処を立てた。</div><div class=\"list-item\"><span class=\"team-name\">ユニオン・サン＝ジロワーズ</span> → <span class=\"team-name\">クリスタル・パレス</span>：MF<span class=\"player-name\">アナン・ハリリ</span>(24歳・イスラエル代表)の完全移籍が成立。移籍金は約2,450万ユーロ。</div><div class=\"list-item\"><span class=\"team-name\">レッドブル・ザルツブルク</span> → <span class=\"team-name\">ハル・シティ</span>：MF<span class=\"player-name\">ルカ・グルナ＝ドゥアト</span>(23歳)の完全移籍が正式発表された。移籍金は約400万ユーロ。</div><div class=\"list-item\"><span class=\"team-name\">フラム</span> → <span class=\"team-name\">ノッティンガム・フォレスト</span>：GK<span class=\"player-name\">スティーブン・ベンダ</span>(28歳)がフリートランスファーで加入することが発表された。</div><div class=\"list-item\"><span class=\"team-name\">インテル・ミラノ</span> → <span class=\"team-name\">ラツィオ</span>：MF<span class=\"player-name\">ダビデ・フラッテージ</span>(26歳・イタリア代表)が期限付き移籍(オプション付き、約500万ユーロ)で加入することが正式発表された。</div><div class=\"list-item\"><span class=\"team-name\">サッスオーロ</span> → <span class=\"team-name\">タジェレス</span>：FW<span class=\"player-name\">アグスティン・アルバレス</span>(25歳・ウルグアイ代表)の期限付き移籍が正式発表された。</div><div class=\"empty-note\">Jリーグ(J1・J2)および<span class=\"team-name\">FC今治</span>に関わる新たな公式移籍発表は、対象期間内には確認できませんでした。<span class=\"team-name\">アーセナル</span>に関する動きは<span class=\"player-name\">ジャレル・クワンサ</span>獲得交渉などの報道段階にとどまり、正式発表はありません。</div>",

    "resultsHtml": "<div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">柏レイソル</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">東京ヴェルディ</span> 1 - 3 <span class=\"team-name\">柏レイソル</span></div><div>2026/27シーズンJ1第2節。<span class=\"team-name\">東京ヴェルディ</span>は前半2分、<span class=\"player-name\">林 尚輝</span>がセットプレーからヘディングで先制し、国立（ＭＵＦＧスタジアム）の大観衆を沸かせた。しかし<span class=\"team-name\">柏レイソル</span>は同11分、<span class=\"player-name\">遠藤 渓太</span>がペナルティエリア手前から右足でゴール右下へ突き刺して同点。後半に入っても<span class=\"team-name\">柏レイソル</span>が主導権を握り、後半20分に途中出場の<span class=\"player-name\">瀬川 祐輔</span>が<span class=\"player-name\">渡井 理己</span>のアシストからエリア手前で右足を振り抜いて勝ち越し、後半37分には<span class=\"player-name\">久保 藤次郎</span>がエリア中央から右足でゴール左下へ流し込んでダメを押した。<span class=\"team-name\">柏レイソル</span>は開幕2連勝でACLエリート出場クラブとしての好スタートを継続。<span class=\"team-name\">東京ヴェルディ</span>は開始早々のリードを守り切れず、今季初勝利はまたも持ち越しとなった。シュート数は<span class=\"team-name\">東京ヴェルディ</span>4本に対し<span class=\"team-name\">柏レイソル</span>11本、入場者数は44,690人だった。</div><div class=\"meta\">明治安田J1リーグ 第2節 ／ 2026年8月14日(金) 19:00 KO ／ ＭＵＦＧスタジアム ／ 得点: <span class=\"player-name\">林 尚輝</span>2分、<span class=\"player-name\">遠藤 渓太</span>11分、<span class=\"player-name\">瀬川 祐輔</span>65分、<span class=\"player-name\">久保 藤次郎</span>82分</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">アトレティコ・マドリード</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">オリンピック・マルセイユ</span> 1 - 2 <span class=\"team-name\">アトレティコ・マドリード</span></div><div>2026/27シーズン開幕前、最後のプレシーズンマッチ。ホームの<span class=\"team-name\">オリンピック・マルセイユ</span>が前半21分、<span class=\"player-name\">イゴール・パイシャン</span>が<span class=\"team-name\">アトレティコ・マドリード</span>のGK<span class=\"player-name\">ヤン・オブラク</span>の頭上を越すループシュートを沈めて先制した。しかし後半、途中出場の<span class=\"player-name\">ロドリゴ・メンドーサ</span>が<span class=\"player-name\">アデモラ・ロオクマン</span>のボール奪取からのパスを受け、エリア内で冷静に流し込んで同点。さらに<span class=\"player-name\">カルロス・マルティン</span>が決勝点を挙げ、<span class=\"team-name\">アトレティコ・マドリード</span>が逆転勝利でプレシーズンを締めくくった。ディエゴ・シメオネ監督にとっては、リーガ開幕を前に守備陣とアタッカー陣の連係を確認する一戦となった。</div><div class=\"meta\">プレシーズン親善試合 ／ 2026年8月14日(現地・日本時間8月15日未明) ／ スタッド・ヴェロドローム(マルセイユ)</div></div></div><div class=\"empty-note\">この2試合以外に、トラッキング対象チームの試合は対象期間内にありませんでした。J1第2節の残り9試合（<span class=\"team-name\">浦和レッズ</span>対<span class=\"team-name\">サンフレッチェ広島</span>を含む）は8月15日18:00以降のキックオフ、J2第2節の<span class=\"team-name\">FC今治</span>対<span class=\"team-name\">RB大宮アルディージャ</span>戦も8月15日以降で、いずれも対象期間外です。ACLエリート2026/27に出場する<span class=\"team-name\">鹿島アントラーズ</span>・<span class=\"team-name\">ヴィッセル神戸</span>・<span class=\"team-name\">京都サンガF.C.</span>・<span class=\"team-name\">ガンバ大阪</span>も8月15日以降の開催。<span class=\"team-name\">アーセナル</span>は8月16日のコミュニティ・シールド、<span class=\"team-name\">レアル・マドリード</span>は8月16日の<span class=\"team-name\">シャルケ04</span>戦、<span class=\"team-name\">チェルシー</span>・<span class=\"team-name\">マンチェスター・ユナイテッド</span>・<span class=\"team-name\">マンチェスター・シティ</span>は8月15日夜（日本時間8月16日未明）のプレシーズン最終戦が次戦です。<span class=\"team-name\">バイエルン・ミュンヘン</span>は8月15日に<span class=\"team-name\">リーズ・ユナイテッド</span>戦、<span class=\"team-name\">パリ・サンジェルマン</span>のリーグ・アン開幕は8月24日（8月17日にトロフェ・デ・シャンピオン）。<span class=\"team-name\">タンピネス・ローバーズ</span>、<span class=\"team-name\">日本代表</span>、<span class=\"team-name\">イングランド代表</span>はこの期間の試合はありませんでした。</div>",
    "standingsHtml": "<div class=\"empty-note\">対象期間中に節が終了したリーグはありません。J1・J2第2節は8月14日〜16日の開催中で、8月14日時点で消化されたのは東京V対柏の1試合のみのため、順位表の更新は第2節終了後に掲載します。プレミアリーグ（8月21日開幕）、ブンデスリーガ（8月28日開幕）、リーガ・エスパニョーラ、セリエAはいずれも2026/27シーズン開幕前で、順位表はまだ存在しません。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">アトレティコ・マドリード</span> が <span class=\"team-name\">トッテナム・ホットスパー</span> から <span class=\"player-name\">クリスティアン・ロメロ</span>(28歳・アルゼンチン代表) の獲得を正式に完了させた。移籍金は各種ボーナスを含めて約4000万ユーロ（約3420万ポンド）で、契約は2031年6月までの5年間。<span class=\"team-name\">トッテナム・ホットスパー</span> は15%のセルオン条項を確保した。<span class=\"player-name\">クリスティアン・ロメロ</span> は前所属クラブでキャプテンを務め、2025年のヨーロッパリーグ制覇に貢献。2026年ワールドカップでは母国を準優勝に導いた。同じアルゼンチン人であるディエゴ・シメオネ監督のもと、<span class=\"team-name\">アトレティコ・マドリード</span> の最終ラインを 支える中心選手となる。<span class=\"team-name\">インテル・ミラノ</span> と <span class=\"team-name\">アーセナル</span> も獲得に動いていたが、いずれも実らなかった。</div><div class=\"list-item\"><span class=\"team-name\">インテル・ミラノ</span> が <span class=\"team-name\">トッテナム・ホットスパー</span> から <span class=\"player-name\">ジェド・スペンス</span>(26歳・イングランド代表) を獲得。移籍金は3150万ユーロ（ボーナス含む）で、契約は2031年まで、将来の移籍時に10%のセルオン条項が付く。右サイドバックを主戦場とする万能型で、<span class=\"team-name\">レアル・マドリード</span> へ移籍した <span class=\"player-name\">デンゼル・ダンフリース</span> の後釜として期待される。</div><div class=\"list-item\"><span class=\"team-name\">インテル・ミラノ</span> が <span class=\"player-name\">ダヴィデ・フラッテージ</span>(26歳・イタリア代表) の <span class=\"team-name\">ラツィオ</span> への期限付き移籍を決定した。買い取りオプション付きの1年契約で、出場機会を求めての国内移籍となる。ゴール前への飛び出しを武器とするインサイドハーフで、<span class=\"team-name\">インテル・ミラノ</span> では出場時間が限られていた。</div><div class=\"list-item\"><span class=\"team-name\">セルティック</span> が <span class=\"team-name\">SCパーダーボルン07</span> から <span class=\"player-name\">ミカ・バウアー</span>(22歳・ドイツU-21代表) の完全移籍加入を公式発表した。契約は2030年までの4年間（延長オプション付き）。移籍金は初期費用525万ユーロ＋ボーナス275万ユーロの総額800万ユーロで、<span class=\"team-name\">SCパーダーボルン07</span> にとってクラブ史上最高額の売却となった。攻撃的MFを本職とし、2部リーグで評価を高めていた逸材。</div>",

    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">マンチェスター・シティ</span>は<span class=\"player-name\">ヘロニモ・ルジ</span>(34歳・アルゼンチン代表)の<span class=\"team-name\">マルセイユ</span>からの完全移籍加入を正式発表した。移籍金は約170万ポンド（約380万ユーロ）で、契約は2028年6月までの2年間、背番号は28。<span class=\"player-name\">ジェームズ・トラフォード</span>が<span class=\"team-name\">リーズ・ユナイテッド</span>へ移籍したことを受け、<span class=\"player-name\">ジャンルイジ・ドンナルンマ</span>に次ぐ第2GKとして獲得された。2016/17シーズンに在籍しながら公式戦出場のなかったクラブへの、9年越しの「出戻り」となる。</div><div class=\"list-item\"><span class=\"team-name\">チェルシー</span>は<span class=\"player-name\">ペップ・チャバリア</span>(28歳)の<span class=\"team-name\">ラージョ・バジェカーノ</span>からの完全移籍加入を正式発表した。移籍金は初期費用1630万ポンド＋追加最大170万ポンド、契約は2031年までの5年間。今夏<span class=\"team-name\">レアル・マドリード</span>へ移籍した<span class=\"player-name\">マルク・ククレジャ</span>の後釜となる左サイドバックで、昨季は<span class=\"team-name\">ラージョ・バジェカーノ</span>のカンファレンスリーグ決勝進出とリーグ8位に貢献した。<span class=\"player-name\">シャビ・アロンソ</span>監督就任後としては9人目の新戦力。</div><div class=\"list-item\"><span class=\"team-name\">クリスタル・パレス</span>は<span class=\"player-name\">エバン・ゲサン</span>(25歳・コートジボワール代表)の<span class=\"team-name\">アストン・ヴィラ</span>からの今季1年間の期限付き移籍加入を正式発表した。買い取りオプション付き。<span class=\"player-name\">エバン・ゲサン</span>は昨季後半戦も<span class=\"team-name\">クリスタル・パレス</span>でプレーして14試合2得点を記録し、5月のUEFAカンファレンスリーグ制覇に貢献していた。<span class=\"team-name\">アストン・ヴィラ</span>では2600万ポンドの移籍金に対し公式戦21試合2得点にとどまっていた。</div><div class=\"empty-note\">上記以外に、対象期間中に公式発表された完全移籍・期限付き移籍で掲載基準（J1・J2クラブ、または海外1部リーグのクラブ、およびトラッキング対象クラブ）を満たすものは確認できませんでした。J1・J2クラブの新規発表はありません。</div>",

    "standingsHtml": "<div class=\"empty-note\">対象期間中に節が終了したリーグはありませんでした。J1・J2の2026/27シーズンは第1節（8月8日〜9日）が終了したのみで、第2節は8月15日以降です。プレミアリーグ・ブンデスリーガ・リーガ・エスパニョーラ・セリエAはいずれも2026/27シーズンが未開幕のため、順位表の更新はありません。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">ノッティンガム・フォレスト</span>は<span class=\"player-name\">ウスマン・ディオマンデ</span>(22歳・コートジボワール代表)の<span class=\"team-name\">スポルティングCP</span>からの完全移籍加入を正式に発表した。移籍金は4000万ユーロとされ、プレミアリーグ復帰2季目に向けた最大級の補強となる。長身のセンターバックで、リスボンでは公式戦での対人守備と持ち出しの質を評価されていた。</div><div class=\"list-item\"><span class=\"team-name\">フラム</span>は<span class=\"player-name\">シェイ・チャールズ</span>(22歳・北アイルランド代表)の<span class=\"team-name\">サウサンプトン</span>からの完全移籍加入を正式発表した。移籍金は3000万ポンド。守備的MFとセンターバックを兼務できるユーティリティ性が持ち味で、中盤の底の再編を進める<span class=\"team-name\">フラム</span>にとって長期的な軸となる。</div><div class=\"list-item\"><span class=\"team-name\">エヴァートン</span>と<span class=\"team-name\">クリスタル・パレス</span>が選手交換の形での2件の完全移籍を同時に正式発表した。<span class=\"player-name\">ドワイト・マクニール</span>(26歳)が<span class=\"team-name\">エヴァートン</span>から<span class=\"team-name\">クリスタル・パレス</span>へ、<span class=\"player-name\">ブレナン・ジョンソン</span>(25歳・ウェールズ代表)が<span class=\"team-name\">クリスタル・パレス</span>から<span class=\"team-name\">エヴァートン</span>へ移る。プレミアリーグでは珍しい直接トレード型の取引となった。</div><div class=\"list-item\"><span class=\"team-name\">マンチェスター・シティ</span>は<span class=\"player-name\">カルヴィン・フィリップス</span>(30歳・イングランド代表)の<span class=\"team-name\">シェフィールド・ユナイテッド</span>への今季1年間の期限付き移籍を発表した。<span class=\"player-name\">カルヴィン・フィリップス</span>は2025/26シーズン後半戦も同クラブでプレーしたが3試合の出場にとどまり負傷離脱しており、再起を期す出戻りレンタルとなる。</div><div class=\"empty-note\">Jリーグ（J1・J2）および<span class=\"team-name\">FC今治</span>が絡む移籍については、対象期間中にクラブ公式発表による確定情報はありませんでした（Jリーグ公式の移籍情報まとめの最終更新は8月10日）。海外でも上記以外は交渉中・合意報道の段階にとどまっています。</div>",

    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">レアル・マドリード</span>が、<span class=\"team-name\">ライプツィヒ</span>のFW<span class=\"player-name\">ヤン・ディオマンデ</span>(19歳・コートジボワール代表)の獲得で合意に達したと正式発表した。契約期間は2033年6月30日までの7年間。スペイン紙『アス』などによれば移籍金は1億2500万ユーロ（約227億円）に加え、成績に応じたボーナス最大1500万ユーロ（約27億円）が付帯し、<span class=\"team-name\">レアル・マドリード</span>にとってクラブ史上最高額の補強となる。<span class=\"player-name\">ヤン・ディオマンデ</span>は2025年夏に<span class=\"team-name\">レガネス</span>から<span class=\"team-name\">ライプツィヒ</span>へステップアップすると、2025-26シーズンは公式戦36試合で13ゴール10アシストを記録。今夏のFIFAワールドカップ2026でもコートジボワール代表として4試合に出場し、決勝トーナメント進出に貢献していた。<span class=\"team-name\">パリ・サンジェルマン</span>や<span class=\"team-name\">リバプール</span>も獲得を争っていた。</div><div class=\"list-item\"><span class=\"team-name\">レアル・マドリード</span>が、FW<span class=\"player-name\">ヴィニシウス・ジュニオール</span>(26歳・ブラジル代表)との契約を2032年6月30日まで延長したと発表した。契約詳細は非公表だが、スペイン『カデナ・セール』などは基本年俸2200万ユーロ（約40億円）＋成績連動ボーナス200万ユーロ（約4億円）と報じている。既存契約が2027年6月末で満了予定だったため、<span class=\"team-name\">アーセナル</span>がクラブ史上最大級の条件を用意して獲得に動いていると伝えられていたが、今回の延長で一連の移籍報道は収束した。<span class=\"player-name\">ヴィニシウス・ジュニオール</span>は2018年夏に<span class=\"team-name\">フラメンゴ</span>から加入し、公式戦通算375試合128ゴール100アシスト、チャンピオンズリーグ2回・ラ・リーガ3回を含む通算14タイトルに貢献している。</div><div class=\"list-item\"><span class=\"team-name\">ASローマ</span>のDF<span class=\"player-name\">アンヘリーニョ</span>(29歳・スペイン代表)が、今季ラ・リーガに昇格した古巣<span class=\"team-name\">デポルティーボ・ラ・コルーニャ</span>へ買い取りオプション付きの期限付き移籍で加入することが決まった。レンタル料は発生せず、買い取りオプションは250万ユーロに設定されている。<span class=\"player-name\">アンヘリーニョ</span>は2024年1月に<span class=\"team-name\">ライプツィヒ</span>から<span class=\"team-name\">ASローマ</span>へ加入していた。</div><div class=\"empty-note\">上記以外に、対象範囲（J1・J2＋トラッキング対象クラブ、および海外各国1部リーグ）で新たに正式発表された移籍はありませんでした。<span class=\"team-name\">セレッソ大阪</span>による<span class=\"team-name\">FCザンクトパウリ</span>のMF<span class=\"player-name\">ジャクソン・アーバイン</span>(33歳・オーストラリア代表)の完全移籍獲得は、クラブ公式発表が8月5日18:00で今回の集計期間より前のため本欄では扱っていません。<span class=\"team-name\">浦和レッズ</span>による<span class=\"team-name\">ロサンゼルス・ギャラクシー</span>のDF<span class=\"player-name\">山根視来</span>(32歳・元日本代表)獲得、<span class=\"team-name\">アーセナル</span>と<span class=\"team-name\">ニューカッスル・ユナイテッド</span>のMF<span class=\"player-name\">ブルーノ・ギマランイス</span>(28歳・ブラジル代表)の合意報道、<span class=\"team-name\">レアル・マドリード</span>のMF<span class=\"player-name\">フランコ・マスタントゥオーノ</span>(18歳・アルゼンチン代表)の<span class=\"team-name\">フィオレンティーナ</span>行きは、いずれもクラブ間交渉・合意段階の報道にとどまり、公式発表が確認できないため掲載していません。</div>",

    "resultsHtml": "<div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">浦和レッズ</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">浦和レッズ</span> 2 - 2 <span class=\"team-name\">RB大宮アルディージャ</span></div><div>J1開幕（8月7日）を前にした埼玉スタジアムでのプレシーズンマッチ。前半11分に<span class=\"team-name\">RB大宮アルディージャ</span>の<span class=\"player-name\">カルリーニョス ジュニオ</span>に先制を許したが、14分に<span class=\"player-name\">渡邊凌磨</span>(30歳・元日本代表)がすぐさま同点弾を沈める。しかし直後の15分に<span class=\"player-name\">泉柊椰</span>に勝ち越されて1-2で折り返した。後半85分、<span class=\"player-name\">オナイウ阿道</span>(30歳・元日本代表)が押し込んで追いつき、2-2の引き分けで終了。入場者数は23,683人だった。</div><div class=\"meta\">Juiceスペシャルマッチ（プレシーズンマッチ）／2026年8月1日 18:03キックオフ・埼玉スタジアム2002</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">柏レイソル</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">ジェフユナイテッド千葉</span> 0 - 0（PK戦の末に<span class=\"team-name\">柏レイソル</span>が勝利）</div><div>ACLエリート2026/27に出場する<span class=\"team-name\">柏レイソル</span>が、千葉ダービー「第31回ちばぎんカップ」でフクダ電子アリーナに乗り込んだ一戦。90分間はスコアレスのまま決着がつかず、PK戦の末に<span class=\"team-name\">柏レイソル</span>が<span class=\"team-name\">ジェフユナイテッド千葉</span>を退けて大会2連覇を達成した。登録メンバー22人全員がピッチに立ち、J1開幕（8月8日の<span class=\"team-name\">水戸ホーリーホック</span>戦）に向けてポジション争いが拮抗していることを印象づけた。</div><div class=\"meta\">Jリーグプレシーズンマッチ 第31回ちばぎんカップ／2026年8月1日 19:00キックオフ・フクダ電子アリーナ</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">タンピネス・ローバーズ</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">ペルシブ・バンドン</span> 1 - 0 <span class=\"team-name\">タンピネス・ローバーズ</span></div><div>インドネシアの大会「ピアラ・プレシデン（プレジデントカップ）2026」グループA最終戦。<span class=\"team-name\">タンピネス・ローバーズ</span>は前半をスコアレスで凌ぎ、GK<span class=\"player-name\">ムハンマド・ザルファン</span>を中心に堅い守備で対抗したが、82分に<span class=\"player-name\">バルシャ・セクリッチ</span>に強烈なシュートを叩き込まれて失点。0-1で敗れ、<span class=\"team-name\">ペルシブ・バンドン</span>が3戦全勝・勝点9でグループ首位通過を決めた。</div><div class=\"meta\">ピアラ・プレシデン2026 グループA／2026年7月31日・スタディオン・シ・ジャラック・ハルパット（バンドン）</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">アーセナル</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">ジローナ</span> 1 - 4 <span class=\"team-name\">アーセナル</span></div><div>プレミアリーグ王者<span class=\"team-name\">アーセナル</span>の今夏初のオープンなプレシーズンマッチで、伝統の「コスタ・ブラバ杯」を懸けた一戦。16分、16歳の<span class=\"player-name\">マックス・ダウマン</span>の絶妙なスルーパスを<span class=\"player-name\">カイ・ハヴァーツ</span>(27歳・ドイツ代表)が流し込んで先制。30分には新加入の<span class=\"player-name\">クリストス・ツォリス</span>(24歳・ギリシャ代表)が加入後初ゴールを決めて2点差とした。後半50分に<span class=\"team-name\">ジローナ</span>の<span class=\"player-name\">アルナウ・マルティネス</span>にCKからヘディングで1点を返されたが、53分に<span class=\"player-name\">ダウマン</span>がボックス外から突き刺し、55分には大怪我から復帰途上の<span class=\"player-name\">ベン・ホワイト</span>(28歳・元イングランド代表)のパスに抜け出した<span class=\"player-name\">ガブリエル・ジェズス</span>(29歳・ブラジル代表)が4点目。<span class=\"player-name\">ミケル・アルテタ</span>監督は62分に一気に8人を交代させ、アカデミー出身の若手に出場機会を与えた。</div><div class=\"meta\">親善試合（コスタ・ブラバ杯／プレシーズン）／2026年8月1日・エスタディ・ムニシパル・デ・モンティリビ（ジローナ）</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">アトレティコ・マドリード</span>と<span class=\"team-name\">マンチェスター・U</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">マンチェスター・U</span> 2 - 1 <span class=\"team-name\">アトレティコ・マドリード</span></div><div>スカンジナビア遠征中の<span class=\"team-name\">マンチェスター・U</span>と、プレシーズン2戦目の<span class=\"team-name\">アトレティコ・マドリード</span>がストックホルムで対戦。5分、<span class=\"player-name\">アルナウ・オルティス</span>(24歳)のクロスが誰にも触れられずそのままゴールに吸い込まれるという幸運な形で<span class=\"team-name\">アトレティコ・マドリード</span>が先制した。しかし前半は<span class=\"team-name\">マンチェスター・U</span>がポゼッション57%・シュート8本と押し込み、後半53分に<span class=\"player-name\">シェイ・レイシー</span>が獲得したPKを<span class=\"player-name\">ブライアン・ムベウモ</span>(26歳・カメルーン代表)が決めて同点。74分には<span class=\"player-name\">ジャック・フレッチャー</span>の折り返しを再び<span class=\"player-name\">ムベウモ</span>がニアで押し込み逆転した。<span class=\"player-name\">ディエゴ・シメオネ</span>監督は61分に先発全員を入れ替えている。両軍ともW杯明けの主力を欠く布陣だった。</div><div class=\"meta\">親善試合（プレシーズン）／2026年8月1日・ストロベリー・アリーナ（ストックホルム／ソルナ）</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">マンチェスター・C</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">マンチェスター・C</span> 1 - 1（PK戦 1-3）<span class=\"team-name\">インテル</span></div><div>香港フットボールフェスティバルの開幕戦。14分、<span class=\"player-name\">アントワーヌ・セメンヨ</span>のクロスを<span class=\"player-name\">ディヴィン・ムバマ</span>がゴール前で押し込んで<span class=\"team-name\">マンチェスター・C</span>が先制したが、その6分後に<span class=\"player-name\">バンジャマン・パヴァール</span>(30歳・フランス代表)にペナルティエリア内から同点弾を許した。1-1で突入したPK戦では<span class=\"player-name\">アイト・ヌーリ</span>と<span class=\"player-name\">フサノフ</span>が失敗し、<span class=\"player-name\">クラウディオ・エチェベリ</span>のみが成功。<span class=\"team-name\">インテル</span>が3-1で制した。観衆は42,826人。</div><div class=\"meta\">親善試合（香港フットボールフェスティバル）／2026年8月1日・香港</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">チェルシー</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">チェルシー</span> 1 - 2 <span class=\"team-name\">トッテナム</span></div><div>シドニーのアコー・スタジアムに80,363人の超満員を集めたロンドン勢対決。<span class=\"player-name\">サンドロ・トナーリ</span>(26歳・イタリア代表)が先制点を挙げると、前半のうちに<span class=\"player-name\">エステヴァン</span>が同点に追いついた。後半に<span class=\"team-name\">トッテナム</span>の<span class=\"player-name\">ケヴィン・ダンソ</span>(27歳・オーストリア代表)が退場して10人となったが、後半アディショナルタイム92分、<span class=\"player-name\">ジェイミー・ドンリー</span>のシュートがポストに跳ね返ったこぼれ球に<span class=\"player-name\">リシャルリソン</span>(29歳・ブラジル代表)が詰めて決勝点。<span class=\"player-name\">ロベルト・デ・ゼルビ</span>監督率いる<span class=\"team-name\">トッテナム</span>はプレシーズン4連勝となった。</div><div class=\"meta\">親善試合（プレシーズン）／2026年8月1日・アコー・スタジアム（シドニー）</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">レアル・マドリード</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">レアル・マドリード</span> 2 - 2 <span class=\"team-name\">フィオレンティーナ</span></div><div>オーストリア・クラーゲンフルトでの一戦。W杯からブラジル代表として戻ってきた<span class=\"player-name\">エンドリック</span>(20歳・ブラジル代表)が12分に反転から鮮やかに決めて先制し、24分には18歳のウインガー<span class=\"player-name\">アレクシス・シリア</span>が続いて2-0とした。しかし前半41分に<span class=\"player-name\">ロベルト・ピッコリ</span>(25歳)に角度のないところから突き刺され、後半58分には<span class=\"player-name\">ニコロ・ファジョーリ</span>(25歳)のクロスを<span class=\"player-name\">モイーズ・ケーン</span>(26歳・イタリア代表)がヘディングで合わせて同点。復帰2季目の<span class=\"player-name\">ジョゼ・モウリーニョ</span>監督にとって今夏初めて勝てなかった試合となった。<span class=\"team-name\">レアル・マドリード</span>は<span class=\"player-name\">キリアン・エムバペ</span>ら多くのW杯組を欠いていた。</div><div class=\"meta\">親善試合（プレシーズン）／2026年8月1日・ヴェルターゼー・シュタディオン（クラーゲンフルト）</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">バルセロナ</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">バーミンガム・シティ</span> 2 - 2（PK戦 3-2）<span class=\"team-name\">バルセロナ</span></div><div>ラ・リーガ王者<span class=\"team-name\">バルセロナ</span>がイングランド2部の<span class=\"team-name\">バーミンガム・シティ</span>の本拠地セント・アンドルーズに乗り込んだプレシーズンマッチ。31分に<span class=\"player-name\">アウグスト・プリスケ</span>のヘディングで先行された<span class=\"team-name\">バルセロナ</span>は、41分に<span class=\"player-name\">ハムザ・アブデルカリム</span>がPKで同点とし、後半60分にも同選手が至近距離から押し込んで逆転。しかし<span class=\"player-name\">ジョン・ソリス</span>に追いつかれ、2-2からのPK戦では5人中3人が失敗して3-2で敗れた。<span class=\"team-name\">バーミンガム・シティ</span>のGK<span class=\"player-name\">ジェームズ・ビードル</span>が2本をセーブしてマン・オブ・ザ・マッチに輝いた。観衆28,366人。</div><div class=\"meta\">親善試合（プレシーズン）／2026年7月31日・セント・アンドルーズ（バーミンガム）</div></div></div><div class=\"empty-note\">対象期間中、<span class=\"team-name\">リバプール</span>、<span class=\"team-name\">バイエルン・ミュンヘン</span>、<span class=\"team-name\">PSG</span>、<span class=\"team-name\">FC今治</span>、ACL出場の<span class=\"team-name\">ヴィッセル神戸</span>・<span class=\"team-name\">鹿島アントラーズ</span>・<span class=\"team-name\">京都サンガF.C.</span>・<span class=\"team-name\">ガンバ大阪</span>・<span class=\"team-name\">FC町田ゼルビア</span>に公式・非公式を問わず確認できる試合はありませんでした。日本代表・イングランド代表も国際Aマッチウィーク外のため活動はありません。</div>",
    "standingsHtml": "<div class=\"empty-note\">対象期間中に節が終了したリーグはありませんでした。2026/27明治安田Jリーグは開幕前（J1は8月7日、J2・J3は8月8日開幕）、プレミアリーグは8月21日開幕、ブンデスリーガ・リーガ・エスパニョーラ・セリエAもいずれもプレシーズン期間中のため、順位表の更新はありません。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">チェルシー</span>（プレミアリーグ）：<span class=\"team-name\">ブライトン</span>（プレミアリーグ）より<span class=\"player-name\">ダニー・ウェルベック</span>(35歳・元イングランド代表)が完全移籍で加入。契約は2年で、移籍金は非公表（英メディアは約500万ポンドと報道）。<span class=\"player-name\">マンチェスター・U</span>の下部組織出身でイングランド代表42キャップを誇るベテランFWは、昨季プレミアリーグ37試合13得点と結果を残していた。すぐに<span class=\"player-name\">シャビ・アロンソ</span>監督率いるチームの香港でのプレシーズンツアーに合流する。</div><div class=\"list-item\"><span class=\"team-name\">ブレントフォード</span>（プレミアリーグ）：<span class=\"team-name\">ランス</span>（リーグ・アン）より<span class=\"player-name\">ママドゥ・サンガレ</span>(24歳・マリ代表)が完全移籍で加入。移籍金は約3900万ポンドでクラブ史上最高額、契約は5年（＋1年オプション）。昨季は<span class=\"team-name\">ランス</span>のリーグ・アン2位とクラブ史上初のクープ・ドゥ・フランス制覇に貢献し、リーグ・アン年間ベストイレブンとアフリカ最優秀選手賞（マルク＝ヴィヴィアン・フォエ賞）に選ばれた。</div><div class=\"list-item\"><span class=\"team-name\">バルセロナ</span>（リーガ・エスパニョーラ）：<span class=\"team-name\">クラブ・ブルージュ</span>（ベルギー・ジュピラー・プロ・リーグ）より<span class=\"player-name\">ジェシー・ビシウ</span>(18歳)が完全移籍で加入。移籍金は約850万ユーロで、契約は2031年6月30日まで。まずは<span class=\"team-name\">バルサ・アトレティック</span>に登録される快足ウインガー。</div><div class=\"list-item\"><span class=\"team-name\">フィオレンティーナ</span>（セリエA）：<span class=\"team-name\">レアル・マドリード</span>（リーガ・エスパニョーラ）より<span class=\"player-name\">ビクトル・バルデペーニャス</span>(19歳)が完全移籍で加入。移籍金は約800万ユーロ。<span class=\"team-name\">レアル・マドリード</span>の下部組織で育ったセンターバック兼左サイドバック。</div><div class=\"list-item\"><span class=\"team-name\">アヤックス</span>（オランダ・エールディヴィジ）：フリーの<span class=\"player-name\">ユリアン・ブラント</span>(30歳・ドイツ代表)がフリートランスファーで加入。<span class=\"team-name\">ボルシア・ドルトムント</span>を退団していた攻撃的MF。</div><div class=\"list-item\"><span class=\"team-name\">ル・アーヴル</span>（リーグ・アン）：<span class=\"team-name\">ウェストブロムウィッチ・アルビオン</span>（イングランド2部）より<span class=\"player-name\">ジョシュ・マジャ</span>(27歳・ナイジェリア代表)がフリートランスファーで加入。</div><div class=\"list-item\"><span class=\"team-name\">ジェノア</span>（セリエA）：<span class=\"team-name\">アル・イテハド</span>（サウジ・プロリーグ）より<span class=\"player-name\">マリオ・ミタイ</span>(22歳・アルバニア代表)が期限付き移籍で加入。レンタル料は約200万ユーロ。</div><div class=\"list-item\"><span class=\"team-name\">エユプスポル</span>（トルコ・スュペルリグ）：<span class=\"team-name\">フィオレンティーナ</span>（セリエA）より<span class=\"player-name\">アブデルハミド・サビリ</span>(29歳・モロッコ代表)が期限付き移籍で加入。</div><div class=\"list-item\"><span class=\"team-name\">ジェフユナイテッド千葉</span>（J1）：<span class=\"team-name\">水戸ホーリーホック</span>（J1）よりDF<span class=\"player-name\">飯田貴敬</span>(31歳)が完全移籍で加入。背番号は22。攻撃参加を武器とする右サイドバックで、清水・京都などを経て2025年に加入した<span class=\"team-name\">水戸ホーリーホック</span>ではクラブ初のJ1昇格に大きく貢献していた。開幕1週間前の緊急補強となる。</div><div class=\"list-item\"><span class=\"team-name\">アルビレックス新潟</span>（J2）：<span class=\"team-name\">コリチーバFC</span>（ブラジル）よりFW<span class=\"player-name\">イウリ・カスティーリョ</span>(30歳)が完全移籍で加入。8月1日にチーム合流予定。2020年に<span class=\"team-name\">レノファ山口FC</span>でJ2・31試合9得点を記録して以来、約5年半ぶりのJリーグ復帰となる。</div><div class=\"list-item\"><span class=\"team-name\">PSSスレマン</span>（インドネシア・スーパーリーグ）：<span class=\"team-name\">北海道コンサドーレ札幌</span>（J2）よりMF<span class=\"player-name\">田中宏武</span>(27歳)が完全移籍で加入。立正大から2022年に<span class=\"team-name\">北海道コンサドーレ札幌</span>へ入団し、2023年には<span class=\"team-name\">藤枝MYFC</span>への期限付き移籍も経験していた。</div><div class=\"list-item\"><span class=\"team-name\">RBライプツィヒU19</span>（ドイツ）：<span class=\"team-name\">RB大宮アルディージャ</span>（J2）よりMF<span class=\"player-name\">神田泰斗</span>(18歳)が期限付き移籍で加入。期限は2027年6月30日まで。<span class=\"team-name\">RB大宮アルディージャ</span>の下部組織出身で2025年にトップチーム昇格を果たしたばかりの逸材が、レッドブル・グループのネットワークを通じてドイツへ渡る。</div><div class=\"list-item\"><span class=\"team-name\">V・ファーレン長崎</span>（J1）：FW<span class=\"player-name\">ジョップ・セリンサリウ</span>(23歳)の<span class=\"team-name\">福山シティフットボールクラブ</span>への育成型期限付き移籍を延長。</div>",

ン・USツアー）／2026年7月29日 現地夜・ヤンキー・スタジアム（ニューヨーク）</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">バイエルン・ミュンヘン</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">ロッタッハ・エーゲルン</span> 0 - 15 <span class=\"team-name\">バイエルン・ミュンヘン</span></div><div>プレシーズン2戦目、テゲルン湖畔での恒例のアマチュアクラブとの一戦。<span class=\"player-name\">アリヨン・イブラヒモビッチ</span>(20歳)が2得点、<span class=\"player-name\">フェリペ・チャベス</span>(19歳)が前半だけで2得点を挙げるなど、前半だけで6点を奪う一方的な展開となった。後半も<span class=\"player-name\">ジョアン・パリーニャ</span>(31歳・ポルトガル代表)、<span class=\"player-name\">アレクサンダル・パヴロヴィッチ</span>(22歳・ドイツ代表)、<span class=\"player-name\">ヨシュア・キミッヒ</span>(31歳・ドイツ代表)らが加点し、15人がかりで15得点。今夏加入の<span class=\"player-name\">ナサニエル・ブラウン</span>(23歳・ドイツ代表)が<span class=\"team-name\">バイエルン・ミュンヘン</span>での初出場を飾った。</div><div class=\"meta\">親善試合（プレシーズン）／2026年7月30日・ロッタッハ・エーゲルン（ドイツ）</div></div></div><div class=\"empty-note\">上記3試合以外、トラッキング対象（浦和レッズ、FC今治、タンピネス・ローバーズ、アーセナル、日本代表、イングランド代表、ACL出場中の日本勢（鹿島・神戸・柏・京都・G大阪・町田）、バルセロナ、レアル・マドリード、マンチェスターU、マンチェスターC、チェルシー、PSG）に対象期間中の試合はありませんでした。Jリーグは2026/27シーズン（秋春制）開幕を8月7日に控えた調整期間で、浦和レッズは7月29日に大原サッカー場で公開トレーニングを実施、初のプレシーズンマッチは8月1日の大宮戦。FC今治はJ2開幕（8月8日）に向けた準備期間。タンピネス・ローバーズはインドネシアのプレジデントカップに参戦中で、次戦は7月31日夜のペルシブ・バンドン戦（対象期間外）。欧州勢の主な次戦は、8月1日にアーセナルがジローナ戦、マンチェスターUがアトレティコ戦（ストックホルム）、マンチェスターCがインテル戦（香港）、チェルシーがトッテナム戦（シドニー）、レアル・マドリードがフィオレンティーナ戦。バルセロナは7月31日にバーミンガム・シティ戦を控える。日本代表・イングランド代表は北中米ワールドカップ終了後のオフ期間で活動なし。</div>",

<script>
function toggleMatch(el) {
  const detail = el.parentElement.querySelector('.match-detail');
  if (detail) detail.classList.toggle('show');
}

const DAYS = JSON.parse(document.getElementById('archive-data').textContent);
let activeIndex = 0;

const READ_KEY = 'soccerNewsReadDates';
function getReadDates() {
  try {
    return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]'));
  } catch (e) {
    return new Set();
  }
}
function markDateRead(date) {
  const read = getReadDates();
  if (!read.has(date)) {
    read.add(date);
    localStorage.setItem(READ_KEY, JSON.stringify([...read]));
  }
}

function renderSidebar() {
  const list = document.getElementById('archive-list');
  const readDates = getReadDates();
  list.innerHTML = DAYS.map((d, i) => {
    const isUnread = !readDates.has(d.date);
    const dot = isUnread ? '<span class="archive-unread-dot" title="未読"></span>' : '';
    return `<div class="archive-item${i === activeIndex ? ' active' : ''}" onclick="showDay(${i})">${dot}<span>${d.label}</span></div>`;
  }).join('');
}

function showDay(idx) {
  activeIndex = idx;
  const d = DAYS[idx];
  document.getElementById('period-label').textContent = d.period;
  document.getElementById('updated-line').textContent = '最終更新: ' + d.updated;
  document.getElementById('results-body').innerHTML = d.resultsHtml;
  document.getElementById('standings-body').innerHTML = d.standingsHtml;
  document.getElementById('transfers-body').innerHTML = d.transfersHtml;
  document.getElementById('goals-body').innerHTML = d.goalsHtml;
  markDateRead(d.date);
  renderSidebar();
}

showDay(0);

// ---- CHAT ----
const CHAT_WORKER_URL = 'https://soccer-chat-proxy.y-furuya0109.workers.dev';
const chatHistory = [];

function escChat(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function appendChatMessage(role, text, sources) {
  const wrap = document.getElementById('chat-messages');
  wrap.classList.add('show');
  const el = document.createElement('div');
  el.className = 'chat-msg ' + role;
  el.textContent = text;
  if (sources && sources.length) {
    const srcWrap = document.createElement('div');
    srcWrap.className = 'chat-sources';
    sources.slice(0, 4).forEach(s => {
      const a = document.createElement('a');
      a.href = s.uri; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '↗ ' + (s.title || s.uri);
      srcWrap.appendChild(a);
    });
    el.appendChild(srcWrap);
  }
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
  return el;
}

document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  const text = input.value.trim();
  if (!text) return;

  appendChatMessage('user', text);
  chatHistory.push({ role: 'user', text });
  input.value = '';
  input.disabled = true;
  btn.disabled = true;

  const pending = appendChatMessage('assistant pending', '考え中…');

  try {
    const res = await fetch(CHAT_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: chatHistory.slice(0, -1) }),
    });
    const data = await res.json();
    pending.remove();
    if (!res.ok || data.error) {
      appendChatMessage('assistant', '(エラーが発生しました。しばらくしてからもう一度お試しください)');
    } else {
      appendChatMessage('assistant', data.reply || '(応答がありませんでした)', data.sources);
      chatHistory.push({ role: 'assistant', text: data.reply || '' });
    }
  } catch (err) {
    pending.remove();
    appendChatMessage('assistant', '(通信エラーが発生しました)');
  } finally {
    input.disabled = false;
    btn.disabled = false;
    input.focus();
  }
});
</script>
</body>
