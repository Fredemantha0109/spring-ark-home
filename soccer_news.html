<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer News — Spring Ark</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Shippori+Mincho:wght@400;500;600&display=swap');

:root {
  --bg: #0c0c0e;
  --surface: #111114;
  --surface2: #18181d;
  --border: #222228;
  --border-bright: #2e2e38;
  --accent: #a8ff78;
  --accent-dim: #4a7a38;
  --accent2: #78c8ff;
  --accent3: #ffb878;
  --text: #dddde8;
  --text-muted: #888899;
  --text-dim: #444455;
  --radius: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Shippori Mincho', serif; font-size: 19px; }

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 9999; opacity: 0.4;
}

.shell {
  display: grid;
  grid-template-rows: 52px 1fr;
  grid-template-columns: 260px 1fr;
  height: 100vh;
}

.topbar {
  grid-column: 1 / -1;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 22px;
}
.logo { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; letter-spacing: 0.2em; color: var(--accent); }
.topbar-sub { font-family: 'DM Mono', monospace; font-size: 15px; color: var(--text-muted); }
.back-btn {
  margin-left: auto; font-family: 'DM Mono', monospace; font-size: 14px; color: var(--text-muted);
  text-decoration: none; border: 1px solid var(--border-bright); padding: 6px 14px;
  border-radius: 4px; letter-spacing: 0.08em; transition: all 0.15s;
}
.back-btn:hover { color: var(--accent2); border-color: var(--accent2); }

/* ARCHIVE SIDEBAR */
.sidebar {
  grid-row: 2; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-inner { flex: 1; overflow-y: auto; padding: 16px 12px; }
.sidebar-inner::-webkit-scrollbar { width: 3px; }
.sidebar-inner::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
.section-label {
  font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.2em;
  color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; padding: 0 4px;
}
.archive-item {
  font-family: 'DM Mono', monospace; font-size: 15px; color: var(--text-muted);
  padding: 9px 10px; border-radius: 5px; cursor: pointer; transition: all 0.12s;
  letter-spacing: 0.02em; margin-bottom: 2px;
  display: flex; align-items: center; gap: 8px;
}
.archive-item:hover { background: var(--surface2); color: var(--text); }
.archive-item.active { background: var(--surface2); color: var(--accent); border-left: 2px solid var(--accent); padding-left: 8px; }
.archive-unread-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent3); flex-shrink: 0;
}

/* MAIN CONTENT */
.content { grid-row: 2; overflow-y: auto; overflow-x: hidden; padding: 16px; padding-bottom: 90px; }
.content::-webkit-scrollbar { width: 3px; }
.content::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
.content-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.updated-line { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text-dim); text-align: right; }

.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden;
}
.panel-header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 9px; }
.panel-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.panel-dot.orange { background: var(--accent3); }
.panel-dot.blue { background: var(--accent2); }
.panel-title { font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.15em; color: var(--text-muted); text-transform: uppercase; }
.panel-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

.empty-note { font-family: 'DM Mono', monospace; font-size: 15px; color: var(--text-dim); padding: 4px 2px; }

/* MATCH RESULT SPOILER */
.match-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 14px;
}
.match-teaser {
  display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  user-select: none;
}
.match-teaser-text { font-size: 17px; color: var(--text); }
.match-teaser-hint { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent2); letter-spacing: 0.05em; }
.match-detail {
  display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-bright);
  font-size: 17px; line-height: 1.7;
}
.match-detail.show { display: block; }
.match-detail .score { font-family: 'DM Mono', monospace; font-size: 19px; color: var(--accent); }
.match-detail .meta { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text-muted); margin-top: 4px; }

/* STANDINGS */
table.standings { width: 100%; border-collapse: collapse; font-size: 16px; }
table.standings th, table.standings td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
table.standings th { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: var(--text-muted); text-transform: uppercase; }
table.standings td.num { font-family: 'DM Mono', monospace; text-align: center; }

/* TRANSFER / GOAL ITEMS */
.list-item {
  padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 5px;
  font-size: 16px; line-height: 1.5;
}

/* TEAM / PLAYER NAME HIGHLIGHTS */
.team-name { color: var(--accent2); font-weight: 600; }
.player-name { color: var(--accent3); font-weight: 600; }

/* CHAT DOCK */
.chat-dock {
  position: fixed; left: 260px; right: 0; bottom: 0; z-index: 100;
  background: var(--surface); border-top: 1px solid var(--border-bright);
  display: flex; flex-direction: column;
  box-shadow: 0 -8px 24px rgba(0,0,0,0.35);
}
.chat-messages {
  display: none; flex-direction: column; gap: 10px;
  max-height: 320px; overflow-y: auto; padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.chat-messages.show { display: flex; }
.chat-messages::-webkit-scrollbar { width: 3px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
.chat-msg { max-width: 74%; font-size: 16px; line-height: 1.65; padding: 9px 12px; border-radius: 8px; white-space: pre-wrap; }
.chat-msg.user { align-self: flex-end; background: var(--accent-dim); color: #eafff0; border-bottom-right-radius: 2px; }
.chat-msg.assistant { align-self: flex-start; background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
.chat-msg.pending { color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 13px; }
.chat-sources { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
.chat-sources a { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent2); text-decoration: none; word-break: break-all; }
.chat-sources a:hover { text-decoration: underline; }
.chat-input-row { display: flex; align-items: center; gap: 10px; padding: 12px 18px; }
.chat-label { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; flex-shrink: 0; }
.chat-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
  padding: 10px 16px; color: var(--text); font-size: 16px; font-family: 'Shippori Mincho', serif;
  outline: none; transition: border-color 0.15s;
}
.chat-input:focus { border-color: var(--accent-dim); }
.chat-input::placeholder { color: var(--text-dim); }
.chat-send-btn {
  background: var(--accent); color: var(--bg); border: none; border-radius: 20px;
  padding: 10px 18px; font-family: 'DM Mono', monospace; font-size: 14px; letter-spacing: 0.05em;
  cursor: pointer; flex-shrink: 0; transition: opacity 0.15s;
}
.chat-send-btn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>

    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">アストン・ヴィラ</span> → <span class=\"team-name\">チェルシー</span>：GK<span class=\"player-name\">エミリアーノ・マルティネス</span>(33歳・アルゼンチン代表)の完全移籍を<span class=\"team-name\">チェルシー</span>が正式発表した。契約は3年間で、移籍金は750万ポンド（約15億円）とされる。<span class=\"team-name\">アストン・ヴィラ</span>では6年間で250試合以上に出場した2022年ワールドカップ優勝GKで、発表から数時間後の<span class=\"team-name\">ブライトン</span>戦でいきなり先発出場を果たした。</div><div class=\"list-item\"><span class=\"team-name\">マンチェスター・シティ</span> → <span class=\"team-name\">コヴェントリー・シティ</span>：DF<span class=\"player-name\">ステフェン・ムフニ</span>(18歳)の今季終了までの期限付き移籍が成立し、<span class=\"team-name\">マンチェスター・シティ</span>が公式発表した。昨季後半は<span class=\"team-name\">ワトフォード</span>で8試合に出場したが負傷でシーズンを終えており、プレミアリーグ昇格組での2度目のレンタルとなる。</div><div class=\"list-item\"><span class=\"team-name\">マンチェスター・ユナイテッド</span> → <span class=\"team-name\">ウェスト・ブロムウィッチ・アルビオン</span>：MF<span class=\"player-name\">トビー・コリヤー</span>(22歳・イングランドU-21代表)の完全移籍が成立した。契約は4年間で、移籍金は固定額300万ポンド、追加条項を含めて最大760万ポンドに達する見込み。昨季はレンタルで同クラブに在籍しており、今回は完全移籍に切り替わった形となる。</div>",
    "goalsHtml": "<div class=\"list-item\"><span class=\"player-name\">鈴木唯人</span>(24歳・日本代表)／<span class=\"team-name\">SCフライブルク</span>／対<span class=\"team-name\">ヴェルダー・ブレーメン</span>／29分・48分・55分：ブンデスリーガ開幕節で先発した<span class=\"player-name\">鈴木唯人</span>(24歳・日本代表)が、3得点すべてをワンタッチシュートで沈めるハットトリックを達成し、<span class=\"team-name\">SCフライブルク</span>の4－1の快勝を演出した。ブンデスリーガで日本人選手のハットトリックは、フランクフルト時代の<span class=\"player-name\">高原直泰</span>(2006-07)、マインツ時代の<span class=\"player-name\">武藤嘉紀</span>(2015-16)に次ぐ史上3人目。リーグ公式インスタグラムもこの偉業を大きく取り上げた。なお同じ<span class=\"team-name\">SCフライブルク</span>の<span class=\"player-name\">後藤啓介</span>(21歳)は80分から途中出場、GK<span class=\"player-name\">ミオ・バックハウス</span>(22歳)は先発フル出場、<span class=\"player-name\">山本理仁</span>(24歳)はメンバー外だった。</div>"

an class=\"team-name\">アーセナル</span>（8月31日アストン・ヴィラ戦）、<span class=\"team-name\">アトレティコ・マドリード</span>（8月30日セビージャ戦）、<span class=\"team-name\">レアル・マドリード</span>（8月31日マラガ戦）、<span class=\"team-name\">バルセロナ</span>（9月1日ラージョ戦）、<span class=\"team-name\">マンチェスター・ユナイテッド</span>・<span class=\"team-name\">チェルシー</span>・<span class=\"team-name\">リバプール</span>はいずれも8月29日以降の節が次戦で、期間中の試合はありませんでした。<span class=\"team-name\">タンピネス・ローバーズ</span>はシンガポール・プレミアリーグの新シーズン開幕前です。日本代表・イングランド代表は代表ウィーク外のため試合はありません。</div>",
    "standingsHtml": "<div class=\"empty-note\">対象期間（2026.08.28 11:30〜2026.08.29 11:30 JST）中に日程を終えたリーグ戦のラウンドはありませんでした。この間に行われたのはプレミアリーグ第2節の金曜開催1試合、ブンデスリーガ開幕節の1試合、ラ・リーガ第3節の2試合、セリエA第2節の1試合、リーグ・アン第2節の1試合のみで、いずれも節としては未消化です。プレミアリーグ第2節は8月29〜30日、ブンデスリーガ第1節は8月29〜30日、ラ・リーガ第3節は8月29〜31日、セリエA第2節は8月29〜31日、明治安田J1リーグ第4節は8月29日に残り試合が行われます。各節が終了し次第、次回以降の更新で順位表を反映します。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">チェルシー</span> → <span class=\"team-name\">アストン・ヴィラ</span>：FW<span class=\"player-name\">ニコラス・ジャクソン</span>(25歳・セネガル代表)の完全移籍を<span class=\"team-name\">アストン・ヴィラ</span>が正式発表した。移籍金は固定額4750万ポンド（約103億円）に追加条項を含めて総額6500万ポンド（約141億円）に達する見込みで、クラブ史上最高額の補強となる。<span class=\"team-name\">ビジャレアル</span>時代に師事したウナイ・エメリ監督との再会となる。</div><div class=\"list-item\"><span class=\"team-name\">チェルシー</span> → <span class=\"team-name\">レアル・ソシエダ</span>：DF<span class=\"player-name\">ママドゥ・サール</span>(20歳・セネガル代表)が2026－27シーズン終了までの期限付き移籍で加入することを<span class=\"team-name\">レアル・ソシエダ</span>が発表。買い取りオプションは付帯しない。左右両サイドをこなす右利きのCBで、今夏のFIFAワールドカップ2026にもセネガル代表として臨んだ。<span class=\"team-name\">レアル・ソシエダ</span>はロビン・ル・ノルマン退団以降CB補強が難航しており、今夏最初の新戦力となる。</div><div class=\"list-item\"><span class=\"team-name\">ウェストハム</span> → <span class=\"team-name\">ブレントフォード</span>：DF<span class=\"player-name\">エル・ハッジ・マリック・ディウフ</span>(21歳・セネガル代表)の完全移籍を<span class=\"team-name\">ブレントフォード</span>が発表した。契約は2031年6月30日までの5年間で、1年間の延長オプション付き。移籍金は固定額3500万ポンドに出来高500万ポンドを加えた総額4000万ポンド（約86億円）とみられる。<span class=\"team-name\">スラヴィア・プラハ</span>から2025年夏に<span class=\"team-name\">ウェストハム</span>へ加入し、左SBを主戦場に公式戦34試合5アシストを記録していた。</div><div class=\"list-item\"><span class=\"team-name\">FC町田ゼルビア</span> → <span class=\"team-name\">レッドスター・ベオグラード</span>：DF<span class=\"player-name\">中山雄太</span>(29歳・日本代表)のセルビア王者移籍が正式決定。3年契約を締結し、背番号は「3」に決まった。移籍金は約110万ユーロ（約2億円）とされる。CBを主戦場に左SB・ボランチもこなす<span class=\"player-name\">中山雄太</span>(29歳・日本代表)にとって、Jリーグ復帰から2年での欧州再挑戦となる。</div><div class=\"list-item\"><span class=\"team-name\">ダマクFC</span> → <span class=\"team-name\">ファジアーノ岡山</span>：GK<span class=\"player-name\">ケヴィン・シルバ</span>(31歳)の完全移籍加入を<span class=\"team-name\">ファジアーノ岡山</span>が発表した。ブラジル出身で、ポルトガルの<span class=\"team-name\">モレイレンセ</span>では正守護神として1部でもプレー。昨季はサウジ・プロフェッショナルリーグ（サウジアラビア1部）の<span class=\"team-name\">ダマクFC</span>で34試合に出場した。ドイツ人GKレナート・モーザーとの定位置争いが予想される。</div><div class=\"list-item\"><span class=\"team-name\"     "resultsHtml": "<div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">チェルシー</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">チェルシー</span> 2－0 <span class=\"team-name\">ルートン・タウン</span></div><div>スタンフォード・ブリッジで行われたカラバオカップ（EFLカップ）2回戦。シャビ・アロンソ監督にとってはチェルシー指揮官として初めてのホーム公式戦だった。<span class=\"team-name\">チェルシー</span>は<span class=\"player-name\">コール・パーマー</span>(24歳・イングランド代表)ら主力を先発に並べたが、公式戦15試合無敗で乗り込んだリーグ1（3部）の<span class=\"team-name\">ルートン・タウン</span>が引いて固め、前半はスコアレスのまま終了。均衡が破れたのは後半50分で、右サイドを内側から追い越した<span class=\"player-name\">マロ・グスト</span>(23歳・フランス代表)のクロスに、この試合が公式戦デビューとなった<span class=\"player-name\">ダニー・ウェルベック</span>(35歳・イングランド代表)がヘディングで合わせて移籍後初ゴール。79分には<span class=\"player-name\">エステヴァン</span>(19歳・ブラジル代表)のシュートをクリアしようとした<span class=\"team-name\">ルートン・タウン</span>の<span class=\"player-name\">ハキーム・オドフィン</span>(28歳)がオウンゴールを献上し、勝負が決まった。3回戦では<span class=\"team-name\">リーズ・ユナイテッド</span>をホームに迎える。</div><div class=\"meta\">カラバオカップ（EFLカップ）2回戦／2026年8月27日／スタンフォード・ブリッジ</div></div></div><div class=\"empty-note\">上記以外のトラッキング対象チームは、対象期間中に公式戦がありませんでした。<span class=\"team-name\">浦和レッズ</span>・<span class=\"team-name\">FC今治</span>、およびACL Elite 2026/27に出場する<span class=\"team-name\">鹿島アントラーズ</span>・<span class=\"team-name\">ヴィッセル神戸</span>・<span class=\"team-name\">柏レイソル</span>・<span class=\"team-name\">京都サンガF.C.</span>・<span class=\"team-name\">ガンバ大阪</span>は、天皇杯2回戦が8月26日に終了し、明治安田J1リーグ第4節は8月29日開催のため空白日。ACL Eliteのリーグステージ開幕は9月14日です。<span class=\"team-name\">アーセナル</span>・<span class=\"team-name\">アトレティコ・マドリード</span>・<span class=\"team-name\">バルセロナ</span>・<span class=\"team-name\">レアル・マドリード</span>・<span class=\"team-name\">マンチェスター・ユナイテッド</span>・<span class=\"team-name\">マンチェスター・シティ</span>・<span class=\"team-name\">リバプール</span>・<span class=\"team-name\">バイエルン・ミュンヘン</span>・<span class=\"team-name\">パリ・サンジェルマン     "standingsHtml": "<div class=\"empty-note\">対象期間（2026.08.27 11:30〜2026.08.28 11:30 JST）中に日程を終えたリーグ戦のラウンドはありませんでした。この間に行われた公式戦はカラバオカップ2回戦の最終日のみで、順位表に反映される試合はありません。プレミアリーグ第2節は8月28〜30日、ブンデスリーガは8月28日に開幕節、ラ・リーガ第3節は8月29〜31日、セリエA第2節は8月29〜31日、明治安田J1リーグ第4節は8月29日に行われます。次回以降の更新で、ブンデスリーガ開幕節をはじめ各リーグの結果が順次反映される見込みです。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">チェルシー</span> → <span class=\"team-name\">ノッティンガム・フォレスト</span>：FW<span class=\"player-name\">リアム・デラップ</span>(23歳・イングランドU-21代表)の完全移籍を<span class=\"team-name\">ノッティンガム・フォレスト</span>が正式発表した。移籍金は約5,245万ユーロ。昨夏に<span class=\"team-name\">イプスウィッチ・タウン</span>から<span class=\"team-name\">チェルシー</span>へ加入していたが、<span class=\"team-name\">チェルシー</span>が<span class=\"player-name\">モーガン・ロジャーズ</span>(24歳・イングランド代表)ら前線を大型補強したことで序列が下がっていた。<span class=\"team-name\">ノッティンガム・フォレスト</span>では<span class=\"player-name\">クリス・ウッド</span>(34歳・ニュージーランド代表)と最前線を争う。</div><div class=\"list-item\"><span class=\"team-name\">フェネルバフチェ</span> → <span class=\"team-name\">バルセロナ</span>：GK<span class=\"player-name\">ドミニク・リバコビッチ</span>(31歳・クロアチア代表)の獲得を<span class=\"team-name\">バルセロナ</span>が正式発表した。契約は2030年6月30日まで。移籍金は固定200万ユーロ＋変動最大200万ユーロ。<span class=\"team-name\">ディナモ・ザグレブ</span>で7シーズンを過ごした後<span class=\"team-name\">フェネルバフチェ</span>へ、その後<span class=\"team-name\">ジローナ</span>と<span class=\"team-name\">ディナモ・ザグレブ</span>にレンタルされていた。<span class=\"team-name\">バルセロナ</span>では正GK<span class=\"player-name\">ジョアン・ガルシア</span>(25歳・スペイン代表)、<span class=\"player-name\">ボイチェフ・シュチェスニー</span>(36歳・元ポーランド代表)に次ぐ位置づけとなる。</div><div class=\"list-item\"><span class=\"team-name\">マンチェスター・シティ</span> → <span class=\"team-name\">レクサム</span>：DF<span class=\"player-name\">イサ・カボレ</span>(25歳・ブルキナファソ代表)の完全移籍が発表された。移籍金は約235万ユーロ。右サイドバック／右ウイングバックを本職とし、レンタルで<span class=\"team-name\">レクサム</span>に在籍していたが今回完全移籍に切り替わった。</div><div class=\"list-item\"><span class=\"team-name\">サッスオーロ</span> → <span class=\"team-name\">ラツィオ</span>：FW<span class=\"player-name\">アンドレア・ピナモンティ</span>(27歳・イタリア代表)の移籍を<span class=\"team-name\">ラツィオ</span>が発表した。移籍金は約300万ユーロで、背番号は9。<span class=\"team-name\">インテル</span>下部組織出身で、<span class=\"team-name\">エンポリ</span>や<span class=\"team-name\">サッスオーロ</span>でセリエA通算2桁得点を経験しているストライカー。</div><div class=\"list-item\"><span class=\"team-name\">バイエルン・ミュンヘン</span> → <span class=\"team-name\">クラブ・ブルッヘ</span>：FW<span class=\"player-name\">ウィズダム・マイク</span>(17歳・ドイツ年代別代表)の完全移籍を両クラブが発表した。移籍金は約500万ユーロ。<span class=\"team-name\">バイエルン・ミュンヘン</span>の下部組織で評価を高めていたウインガーが、ベルギー王者で出場機会を求める。</div><div class=\"list-item\"><span class=\"team-name\">ケルン</span> → <span class=\"team-name\">ザンクトパウリ</span>：FW<span class=\"player-name\">ユスファ・ニアン</span>(19歳)の期限付き移籍が発表された。<span class=\"team-name\">ケルン</span>では出場機会が限られていた長身アタッカーで、レンタル先で実戦経験を積む。</div><div class=\"list-item\"><span class=\"team-name\">ストラスブール</span> → <span class=\"team-name\">ウェステルロー</span>：MF<span class=\"player-name\">パペ・ディオン</span>(20歳)の完全移籍を<span class=\"team-name\">ストラスブール</span>が公式に発表した。ベルギー1部の<span class=\"team-name\">ウェステルロー</span>へ完全移籍し、新天地でレギュラー定着を目指す。</div><div class=\"list-item\"><span class=\"team-name\">ジローナ</span> → <span class=\"team-name\">レンジャーズ</span>：MF<span class=\"player-name\">キム・ミンス</span>(20歳・韓国代表)の移籍を<span class=\"team-name\">レンジャーズ</span>が発表した。移籍金は約850万ポンドで、契約は4年＋1年オプション。2022年夏に<span class=\"team-name\">ジローナ</span>の育成組織へ加入し、昨季はスペイン2部の<span class=\"team-name\">アンドラ</span>へレンタルされて40試合6得点4アシストを記録していた。今夏の<span class=\"team-name\">レンジャーズ</span>にとって12人目の新戦力となる。</div>",

    "standingsHtml": "<div class=\"empty-note\">対象期間（2026.08.26 11:30〜2026.08.27 11:30 JST）中に日程を終えたリーグ戦のラウンドはありませんでした。この日行われたのは天皇杯2回戦（カップ戦）とカラバオカップ2回戦のみで、順位表に反映される試合はありません。プレミアリーグ第1節・ラ・リーガ第2節・セリエA第1節は8月24日までに、J1・J2第3節は8月23日までに終了済みです。ブンデスリーガは8月28日開幕のため順位表がまだ存在しません。次の更新は8月28〜31日に行われる各リーグの節が終了したタイミングになります。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">リール</span> → <span class=\"team-name\">マンチェスター・シティ</span>：MF<span class=\"player-name\">アユーブ・ブアッディ</span>(18歳・モロッコ代表)の完全移籍を<span class=\"team-name\">マンチェスター・シティ</span>が正式発表した。契約は2031年6月までの5年契約で、移籍金は固定8,130万ポンド＋ボーナス430万ポンドの最大8,560万ポンド（約1億ユーロ）。プレミアリーグ史上最高額のティーンエイジャー獲得となり、<span class=\"team-name\">マンチェスター・シティ</span>を退団した<span class=\"player-name\">ロドリ</span>(30歳・スペイン代表)の後継として期待される。</div><div class=\"list-item\"><span class=\"team-name\">ノッティンガム・フォレスト</span> → <span class=\"team-name\">エクセルシオール・ロッテルダム</span>：DF<span class=\"player-name\">エリク・ダ・シウバ・モレイラ</span>(20歳)の今季いっぱいの期限付き移籍が発表された。ハンブルク育ちのドイツ年代別代表で、2024年に<span class=\"team-name\">ザンクトパウリ</span>から<span class=\"team-name\">ノッティンガム・フォレスト</span>へ加入。昨季前半戦は<span class=\"team-name\">リオ・アヴェ</span>でプレーしていたが、出場機会を求めてエールディヴィジへ渡る。</div><div class=\"list-item\"><span class=\"team-name\">ビジャレアル</span> → <span class=\"team-name\">コモ</span>：DF<span class=\"player-name\">ウィリー・カンブワラ</span>(21歳・コンゴ民主共和国代表)が2026/27シーズン終了までの期限付き移籍で加入すると<span class=\"team-name\">コモ</span>が発表した。買い取りオプション付き。キンシャサ生まれのセンターバックで、<span class=\"team-name\">マンチェスター・ユナイテッド</span>から<span class=\"team-name\">ビジャレアル</span>へ移った実力者。</div><div class=\"list-item\"><span class=\"team-name\">ジェノア</span> → <span class=\"team-name\">シャフタール・ドネツク</span>：DF<span class=\"player-name\">アラン・マトゥーロ</span>(21歳・ウルグアイU-20代表)の完全移籍が両クラブから発表された。移籍金は約400〜500万ユーロ、契約は2031年7月31日まで。2023年のU-20ワールドカップ優勝メンバーで大会シルバーボールを受賞、昨季はラ・リーガの<span class=\"team-name\">レバンテ</span>へレンタルされ21試合に出場していた。</div><div class=\"list-item\"><span class=\"team-name\">バイエルン・ミュンヘン</span> → <span class=\"team-name\">マクデブルク</span>：MF<span class=\"player-name\">フェリペ・チャベス</span>(19歳・ペルー代表)の期限付き移籍を<span class=\"team-name\">バイエルン・ミュンヘン</span>が正式発表した。同時に<span class=\"team-name\">バイエルン・ミュンヘン</span>との契約を2028年6月30日まで延長している。昨季後半戦は<span class=\"team-name\">ケルン</span>でブンデスリーガ初挑戦を経験しており、今季は2部で継続的な出場機会を求める。</div><div class=\"empty-note\">Jリーグ勢（J1・J2）で対象期間中に成立が正式発表された移籍はありませんでした。<span class=\"team-name\">FC町田ゼルビア</span>はDF<span class=\"player-name\">中山雄太</span>(29歳・日本代表)について「移籍を前提とした手続きと準備のため」チームを離脱したと8月26日に発表していますが、移籍先クラブからの正式発表がまだないため、確定情報としては掲載していません。</div>",

    "resultsHtml": "<div class=\"empty-note\">対象期間（2026.08.25 11:30〜2026.08.26 11:30 JST）中に行われたトラッキング対象チームの試合はありませんでした。プレミアリーグは8月24日の<span class=\"team-name\">フラム</span>－<span class=\"team-name\">チェルシー</span>で第1節を終え、第2節は8月28日の<span class=\"team-name\">クリスタル・パレス</span>－<span class=\"team-name\">マンチェスター・シティ</span>から。<span class=\"team-name\">アーセナル</span>は8月31日の<span class=\"team-name\">アストン・ヴィラ</span>戦、<span class=\"team-name\">マンチェスター・ユナイテッド</span>は8月30日、<span class=\"team-name\">リヴァプール</span>は8月29日、<span class=\"team-name\">チェルシー</span>は8月30日がそれぞれ次戦です。ラ・リーガも8月24日で第2節を終えており、第3節は8月28日開幕で<span class=\"team-name\">アトレティコ・マドリード</span>は8月29日の<span class=\"team-name\">セビージャ</span>戦、<span class=\"team-name\">レアル・マドリード</span>は8月29日の<span class=\"team-name\">マラガ</span>戦、<span class=\"team-name\">バルセロナ</span>は8月31日の<span class=\"team-name\">ラージョ・バジェカーノ</span>戦。ブンデスリーガは8月28日開幕で、<span class=\"team-name\">バイエルン・ミュンヘン</span>はDFBポカール1回戦（対<span class=\"team-name\">VfLオスナブリュック</span>）も9月2日に順延されています。リーグ・アンは<span class=\"team-name\">パリ・サンジェルマン</span>の第2節（対<span class=\"team-name\">リール</span>）が8月28日。J1・J2は8月22〜23日で第3節を終えており、<span class=\"team-name\">浦和レッズ</span>・<span class=\"team-name\">FC今治</span>ともに次戦は8月26日18:30〜19:00開始の天皇杯2回戦（<span class=\"team-name\">FC今治</span>は<span class=\"team-name\">ブラウブリッツ秋田</span>戦）で、いずれも対象期間終了後のキックオフです。ACL出場中の日本勢（<span class=\"team-name\">鹿島アントラーズ</span>、<span class=\"team-name\">ヴィッセル神戸</span>、<span class=\"team-name\">柏レイソル</span>、<span class=\"team-name\">京都サンガF.C.</span>、<span class=\"team-name\">ガンバ大阪</span>）も同様で、ACLエリートのリーグステージ開幕は9月14日です。<span class=\"team-name\">タンピネス・ローバーズ</span>が戦うシンガポール・プレミアリーグ2026/27は9月11日開幕（9月6日にコミュニティ・シールドで<span class=\"team-name\">ライオン・シティ・セーラーズ</span>と対戦）のため、対象期間中の公式戦はありません。日本代表・イングランド代表も国際Aマッチウィーク外で活動はありませんでした。なお8月25日にはUEFAチャンピオンズリーグ・プレーオフ2回戦が行われ<span class=\"team-name\">サバフ</span>、<span class=\"team-name\">LASK</span>、<span class=\"team-name\">ボドー/グリムト</span>がリーグフェーズ進出を決めましたが、トラッキング対象クラブの出場はありませんでした。</div>",
    "standingsHtml": "<div class=\"empty-note\">対象期間中に日程を終えたリーグ戦のラウンドはありませんでした。プレミアリーグ第1節（8月24日終了）、ラ・リーガ第2節（8月24日終了）、セリエA第1節（8月24日終了）、J1・J2第3節（8月23日終了）はいずれも対象期間の開始前に完了しています。ブンデスリーガは8月28日開幕のため、まだ順位表が存在しません。次回の順位表更新は、8月28〜31日に行われる各リーグの節が終了したタイミングになります。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">マンチェスター・シティ</span> → <span class=\"team-name\">トッテナム・ホットスパー</span>：FW<span class=\"player-name\">サヴィーニョ</span>（22歳・ブラジル代表）の完全移籍を両クラブが正式発表した。移籍金は基本7,500万ポンド＋ボーナス最大1,000万ポンドの総額8,500万ポンド（約8,770万ユーロ）で、うち500万ポンドは実質確定分とされる。<span class=\"team-name\">マンチェスター・シティ</span>にとってはクラブ史上最高額での選手売却となった。ブラジル代表の左ウイングは2024年夏にトロワから加入し、2シーズンでシティを去ることになる。</div><div class=\"list-item\"><span class=\"team-name\">ブライトン&ホーヴ・アルビオン</span> → <span class=\"team-name\">マンチェスター・ユナイテッド</span>：MF<span class=\"player-name\">カルロス・バレバ</span>（22歳・カメルーン代表）の完全移籍を<span class=\"team-name\">マンチェスター・ユナイテッド</span>が正式発表した。移籍金は約7,590万ユーロで、契約は5年＋1年の延長オプション付き。今夏長く交渉が続いていた案件がようやく決着し、<span class=\"team-name\">マンチェスター・ユナイテッド</span>は<span class=\"player-name\">アンドレイ・サントス</span>（22歳・ブラジル代表）、<span class=\"player-name\">ユーリ・ティーレマンス</span>（29歳・ベルギー代表）に続く中盤の大型補強を完了させた。</div><div class=\"list-item\"><span class=\"team-name\">ユヴェントス</span> → <span class=\"team-name\">ボーンマス</span>：GK<span class=\"player-name\">ミケーレ・ディ・グレゴリオ</span>（29歳・イタリア代表）の今季いっぱいの期限付き移籍を両クラブが正式発表した。レンタル料は130万ユーロで、成績条件に応じて最大80万ユーロが加算される。シーズン終了時には1,270万ユーロ（3期分割払い）＋追加ボーナス最大150万ユーロの買い取りオプションが設定されている。</div><div class=\"list-item\"><span class=\"team-name\">ACミラン</span> → <span class=\"team-name\">RBライプツィヒ</span>：FW<span class=\"player-name\">クリストフ・ンクンク</span>（28歳・フランス代表）の今季いっぱいの期限付き移籍を<span class=\"team-name\">ACミラン</span>が公式声明で発表した。レンタル料は300万ユーロで、2,800万ユーロの買い取りオプション付き。<span class=\"team-name\">チェルシー</span>、<span class=\"team-name\">ACミラン</span>と渡り歩いた<span class=\"player-name\">クリストフ・ンクンク</span>は、自身が最も結果を残した古巣<span class=\"team-name\">RBライプツィヒ</span>への復帰を選んだ。</div><div class=\"list-item\"><span class=\"team-name\">ヤング・ボーイズ</span> → <span class=\"team-name\">ブライトン&ホーヴ・アルビオン</span>：DF<span class=\"player-name\">ジャウエン・アジャム</span>（23歳・アルジェリア代表）の完全移籍を<span class=\"team-name\">ブライトン&ホーヴ・アルビオン</span>が正式発表した。移籍金は約1,300万ユーロ。スピードと持ち運び、クロスの質を備えた左サイドバックで、<span class=\"player-name\">カルロス・バレバ</span>（22歳・カメルーン代表）を放出した<span class=\"team-name\">ブライトン&ホーヴ・アルビオン</span>の再投資の一環となる。</div><div class=\"list-item\"><span class=\"team-name\">チェルシー</span> → <span class=\"team-name\">ストラスブール</span>：FW<span class=\"player-name\">オマリ・ケリーマン</span>（20歳）の完全移籍を<span class=\"team-name\">ストラスブール</span>が正式発表した。移籍金は約600万ユーロ。昨季はカーディフ・シティへの期限付き移籍で36試合11得点を記録しており、BlueCo傘下クラブ間での移籍で本格的なトップリーグ経験を積むことになる。</div><div class=\"list-item\"><span class=\"team-name\">リヴァプール</span> → <span class=\"team-name\">セント・ミレン</span>：DF<span class=\"player-name\">カルヴィン・ラムジー</span>（23歳・スコットランド代表）の今季いっぱいの期限付き移籍を<span class=\"team-name\">リヴァプール</span>が正式発表した。これで通算5度目のレンタルとなり、2022年にアバディーンから加入した右サイドバックは、今季限りで満了となる<span class=\"team-name\">リヴァプール</span>との契約を実質的に消化する形になる。</div><div class=\"list-item\"><span class=\"team-name\">パリ・サンジェルマン</span> → <span class=\"team-name\">パフォスFC</span>：DF<span class=\"player-name\">ヨラム・ザグ</span>（20歳）の2026-27シーズン終了までの期限付き移籍を<span class=\"team-name\">パリ・サンジェルマン</span>が正式発表した。買い取りオプション付き。コペンハーゲン、KASオイペンに続く3季連続のレンタルで、右サイドバックの<span class=\"player-name\">ヨラム・ザグ</span>は<span class=\"team-name\">パリ・サンジェルマン</span>と2028年まで契約を残している。</div><div class=\"empty-note\">Jリーグ勢（J1・J2および<span class=\"team-name\">FC今治</span>）については、対象期間中に公式発表された移籍はありませんでした。<span class=\"team-name\">NECナイメヘン</span>から<span class=\"team-name\">FC町田ゼルビア</span>へのFW<span class=\"player-name\">小川航基</span>（28歳・日本代表）の完全移籍は8月24日発表で、対象期間の開始前のため今回は掲載していません。また<span class=\"team-name\">マンチェスター・シティ</span>による<span class=\"player-name\">アユーブ・ブアディ</span>（19歳・モロッコ代表）、<span class=\"team-name\">トッテナム・ホットスパー</span>による<span class=\"player-name\">オマル・マルムーシュ</span>（27歳・エジプト代表）の獲得はいずれも合意報道の段階で、正式発表には至っていないため除外しています。</div>",

    "resultsHtml": "<div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">チェルシー</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">フラム</span> 2－3 <span class=\"team-name\">チェルシー</span></div><div>プレミアリーグ第1節の最終カード。ロンドン・ダービーは立ち上がり1分、<span class=\"team-name\">チェルシー</span>の<span class=\"player-name\">ジョアン・ペドロ</span>(24歳・ブラジル代表)がいきなりネットを揺らす電撃の先制点で幕を開けた。<span class=\"team-name\">フラム</span>は23分に<span class=\"player-name\">ジョシュア・キング</span>(20歳)が同点弾を沈めて追いつくが、41分に<span class=\"player-name\">モーガン・ロジャーズ</span>(24歳・イングランド代表)が勝ち越し、後半開始直後の49分には<span class=\"player-name\">コール・パーマー</span>(24歳・イングランド代表)が3点目を挙げて突き放した。54分に<span class=\"team-name\">フラム</span>の<span class=\"player-name\">ゴンサロ・ガルシア</span>(22歳)が1点差に迫り、ボール支配率61％対39％と押し込む展開が続いたものの、<span class=\"team-name\">チェルシー</span>は少ない手数で18本のシュートを浴びせる効率の良さで振り切り、開幕戦を白星で飾った。期待値(xG)はフラム1.35に対しチェルシー1.70。</div><div class=\"meta\">プレミアリーグ 第1節 ／ 2026年8月24日(月) 20:00 KO(現地) ／ クレイヴン・コテージ ／ 入場者数 27,461人 ／ 主審 ジョン・ブルックス ／ HT 1－2 ／ 得点: <span class=\"player-name\">ジョアン・ペドロ</span> 1分、<span class=\"player-name\">ジョシュア・キング</span> 23分、<span class=\"player-name\">モーガン・ロジャーズ</span> 41分、<span class=\"player-name\">コール・パーマー</span> 49分、<span class=\"player-name\">ゴンサロ・ガルシア</span> 54分</div></div></div><div class=\"empty-note\">上記以外に、対象期間中に行われたトラッキング対象チームの試合はありませんでした。J1・J2は8月23日で第3節・第3節の日程を終えており、<span class=\"team-name\">浦和レッズ</span>・<span class=\"team-name\">FC今治</span>ともに対象期間中の試合はありません。ラ・リーガ第2節の8月24日開催分は<span class=\"team-name\">オサスナ</span>－<span class=\"team-name\">レバンテ</span>、<span class=\"team-name\">マラガ</span>－<span class=\"team-name\">デポルティボ・ラ・コルーニャ</span>の2試合のみで、<span class=\"team-name\">アトレティコ・マドリード</span>・<span class=\"team-name\">バルセロナ</span>・<span class=\"team-name\">レアル・マドリード</span>はいずれも出場せず、<span class=\"team-name\">アーセナル</span>、<span class=\"team-name\">マ     "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">ロイヤル・アントワープ</span> → <span class=\"team-name\">サンダーランド</span>：MF<span class=\"player-name\">ジュール・アオカ</span>(20歳・コンゴ民主共和国代表)の完全移籍加入を<span class=\"team-name\">サンダーランド</span>が正式発表した。移籍金は約800万ポンドで、契約期間は5年。背番号は29に決定した。今夏のトゥーロン国際大会で評価を高めた守備的MFで、<span class=\"team-name\">サンダーランド</span>にとっては今夏の主要補強の一つとなる。</div><div class=\"list-item\"><span class=\"team-name\">イプスウィッチ・タウン</span> → <span class=\"team-name\">バレンシア</span>：GK<span class=\"player-name\">カイン・ファン・オーフェレン</span>(23歳)の今季いっぱいの期限付き移籍を両クラブが正式発表した。オランダ出身の<span class=\"player-name\">カイン・ファン・オーフェレン</span>は今夏フォレンダムから約340万ポンドで<span class=\"team-name\">イプスウィッチ・タウン</span>に加入したばかりだが、正GK争いに挑むより出場機会を求め、ラ・リーガで研鑽を積む道を選んだ。</div><div class=\"list-item\"><span class=\"team-name\">ニース</span> → <span class=\"team-name\">ハンブルガーSV</span>：FW<span class=\"player-name\">テレム・モフィ</span>(27歳・ナイジェリア代表)の完全移籍加入を<span class=\"team-name\">ハンブルガーSV</span>が正式発表した。移籍金は固定250万ユーロ（うちボーナス50万ユーロ）で、契約は2029年まで。背番号9を託される。<span class=\"player-name\">テレム・モフィ</span>は2023年10月にナイジェリア代表デビューを果たし、A代表通算23試合6得点2アシストを記録している。</div><div class=\"list-item\"><span class=\"team-name\">アイントラハト・フランクフルト</span> → <span class=\"team-name\">ニース</span>：FW<span class=\"player-name\">エリー・ワヒ</span>(23歳・コートジボワール代表)の今季いっぱいの期限付き移籍を両クラブが正式発表した。2025年1月に<span class=\"team-name\">オリンピック・マルセイユ</span>から<span class=\"team-name\">アイントラハト・フランクフルト</span>へ移った<span class=\"player-name\">エリー・ワヒ</span>だったが、公式戦25試合614分で1得点にとどまり、古巣リーグ・アンへ戻って復調を期すことになった。</div><div class=\"empty-note\">Jリーグ勢（J1・J2および<span class=\"team-name\">FC今治</span>）については、対象期間中に公式発表された移籍はありませんでした。また<span class=\"team-name\">マンチェスター・シティ</span>による<span class=\"player-name\">アユーブ・ブアディ</span>(19歳・モロッコ代表)の獲得は<span class=\"team-name\">リール</span>との合意報道の段階で、正式発表には至っていないため掲載していません。</div>",
    "goalsHtml": "<div class=\"empty-note\">対象期間中、プレミアリーグ・ブンデスリーガ・ラ・リーガ・セリエAでの日本人選手の得点はありませんでした。対象期間に行われたプレミアリーグの<span class=\"team-name\">フラム</span>－<span class=\"team-name\">チェルシー</span>戦は両チームとも日本人選手の登録がなく、ラ・リーガの<span class=\"team-name\">オサスナ</span>－<span class=\"team-name\">レバンテ</span>、<span class=\"team-name\">マラガ</span>－<span class=\"team-name\">デポルティボ・ラ・コルーニャ</span>の2試合にも日本人選手の出場はありませんでした。セリエAは対象期間中に試合がなく、ブンデスリーガは8月28日開幕のため対象がありません。</div>"

er-name\">イ・ガンイン</span>、<span class=\"player-name\">モルテン・ヒュルマンド</span>、<span class=\"player-name\">アレハンドロ・グリマルド</span>を揃って先発起用。<span class=\"team-name\">バルセロナ</span>移籍願望が報じられる<span class=\"player-name\">フリアン・アルバレス</span>はベンチスタートとなった。スコアレスで折り返した後半59分、<span class=\"player-name\">マルク・プビル</span>が<span class=\"player-name\">ジュリアーノ・シメオネ</span>とのパス交換から強烈なミドルシュートを突き刺して先制。しかし66分、<span class=\"player-name\">モルテン・ヒュルマンド</span>が与えたPKを<span class=\"team-name\">ビジャレアル</span>の<span class=\"player-name\">ジェラール・モレノ</span>に沈められて追いつかれる。さらに73分には<span class=\"player-name\">ロビン・ル・ノルマン</span>がボックス内で<span class=\"player-name\">ゲオルゲス・ミカウターゼ</span>を両手で突き飛ばし、VAR介入の末に一発退場。このPKを<span class=\"player-name\">ゲオルゲス・ミカウターゼ</span>が決めて逆転を許した。それでも10人の<span class=\"team-name\">アトレティコ・マドリード</span>は85分、<span class=\"player-name\">アレックス・バエナ</span>のスルーパスに抜け出した<span class=\"player-name\">ジュリアーノ・シメオネ</span>が右足で流し込み土壇場で同点。試合後、<span class=\"player-name\">フリアン・アルバレス</span>だけがサポーターへの挨拶に加わらずロッカーへ引き上げ、ブーイングを浴びた。</div><div class=\"meta\">ラ・リーガ 第2節 ／ 2026年8月23日(現地)・日本時間8月24日0:00 KO ／ リヤド・エア・メトロポリターノ ／ 得点: <span class=\"player-name\">マルク・プビル</span> 59分、<span class=\"player-name\">ジェラール・モレノ</span> 66分(PK)、<span class=\"player-name\">ゲオルゲス・ミカウターゼ</span> 78分(PK)、<span class=\"player-name\">ジュリアーノ・シメオネ</span> 85分</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">バルセロナ</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">エルチェ</span> 0－5 <span class=\"team-name\">バルセロナ</span></div><div>ハンジ・フリック監督3年目、リーガ3連覇を狙う<span class=\"team-name\">バルセロナ</span>の今季初戦。13分、敵陣左サイドでのハイプレスから<span class=\"player-name\">フェルミン・ロペス</span>がスルーパスを通し、<span class=\"player-name\">ハフィーニャ</span>が倒されてPKを獲得。これを自ら沈めて先制した。44分には<span class=\"player-name\">ガビ</span>がピッチに座り込んで<span class=\"player-name\">ペドリ</span>との交代を強いられるアクシデントもあったが、45+3分には<span c     "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">マラガCF</span> → <span class=\"team-name\">ガンバ大阪</span>：スペイン出身のMF<span class=\"player-name\">ファンペ</span>(30歳)の完全移籍加入を<span class=\"team-name\">ガンバ大阪</span>が正式発表した。カディスCF Bでキャリアをスタートし、アトレティコ・マンチャ・レアル、セビージャ・アトレティコ、CDルーゴなどを経て2023年7月から<span class=\"team-name\">マラガCF</span>でプレーしていた。クラブを通じて「守備でも攻撃でもチームに貢献し、ゴールに繋げられるよう頑張りたい」とコメントを寄せている。</div><div class=\"empty-note\">上記以外に、対象期間中に確定した対象範囲内の移籍はありませんでした。欧州5大リーグでは対象期間中に公式発表された完了移籍がなく、<span class=\"team-name\">マンチェスター・ユナイテッド</span>による<span class=\"player-name\">カルロス・バレバ</span>(22歳・カメルーン代表)の獲得や、<span class=\"team-name\">マンチェスター・シティ</span>による<span class=\"player-name\">アユーブ・ブアディ</span>(19歳)の獲得などはいずれも合意報道の段階で、正式発表には至っていません。</div>",

    "resultsHtml": "<div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">鹿島アントラーズ</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">鹿島アントラーズ</span> 3－2 <span class=\"team-name\">アビスパ福岡</span></div><div>打ち合いを制した<span class=\"team-name\">鹿島アントラーズ</span>が12季ぶりの開幕3連勝を達成した。31分に相手のオウンゴールで先制すると、43分に<span class=\"team-name\">鹿島アントラーズ</span>の出身クラブである<span class=\"team-name\">アビスパ福岡</span>のFW<span class=\"player-name\">師岡柊生</span>に“恩返し弾”を浴びて追いつかれる。それでも60分に<span class=\"player-name\">レオ・セアラ</span>が3試合連続ゴールとなる勝ち越し点を挙げ、その4分後の64分には<span class=\"player-name\">チャヴリッチ</span>が加点。76分にオウンゴールで1点差に迫られたが、そのまま逃げ切った。<span class=\"team-name\">鹿島アントラーズ</span>はこれで3試合連続の1点差勝利。<span class=\"team-name\">アビスパ福岡</span>は開幕3試合で初勝利がまだ遠い。</div><div class=\"meta\">明治安田J1リーグ 第3節／2026年8月22日 18:00キックオフ・メルカリスタジアム</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">ガンバ大阪</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">名古屋グランパス</span> 3－1 <span class=\"team-name\">ガンバ大阪</span></div><div>ACLエリート出場の<span class=\"team-name\">ガンバ大阪</span>が敵地で3失点の完敗を喫した。7分に<span class=\"team-name\">名古屋グランパス</span>の<span class=\"player-name\">木村勇大</span>に先制を許したものの、11分に<span class=\"player-name\">食野亮太郎</span>が早々に同点弾を突き刺して振り出しに戻す。しかし退場者を出して数的不利に陥ると、83分に<span class=\"player-name\">浅野雄也</span>、後半アディショナルタイム7分に<span class=\"player-name\">小野雅史</span>に決められて力尽きた。開幕2連敗中だった<span class=\"team-name\">名古屋グランパス</span>は待望の今季初白星。</div><div class=\"meta\">明治安田J1リーグ 第3節／2026年8月22日 19:00キックオフ・豊田スタジアム</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span c ">浦和レッズ</span>の<span class=\"team-name\">FC町田ゼルビア</span>戦（J1第3節）は8月23日19:30、<span class=\"team-name\">アトレティコ・マドリード</span>のラ・リーガ第2節<span class=\"team-name\">ビジャレアル</span>戦は日本時間8月24日0:00、<span class=\"team-name\">バルセロナ</span>は同8月24日4:30の<span class=\"team-name\">エルチェ</span>戦、<span class=\"team-name\">アーセナル</span>のプレミアリーグ第2節<span class=\"team-name\">アストン・ヴィラ</span>戦は8月31日、<span class=\"team-name\">マンチェスター・シティ</span>・<span class=\"team-name\">チェルシー</span>・<span class=\"team-name\">リヴァプール</span>のプレミアリーグ開幕節はいずれも8月23日〜24日、<span class=\"team-name\">パリ・サンジェルマン</span>のリーグ・アン開幕戦<span class=\"team-name\">スタッド・レンヌ</span>戦は日本時間8月24日3:45にそれぞれ行われます。<span class=\"team-name\">タンピネス・ローバーズ</span>が所属するシンガポール・プレミアリーグは9月11日開幕、ACLエリート本戦は9月14日開幕です。日本代表・イングランド代表は代表ウィーク外で活動がありませんでした。</div>",
    "standingsHtml": "<div class=\"empty-note\">対象期間中に節が終了したリーグはありませんでした。明治安田J1リーグ第3節は8月23日の町田－浦和戦を残して未消化、プレミアリーグ第1節は8月23日〜24日に5試合を残しています。ラ・リーガ第2節も8月23日〜24日に4試合が残り、セリエAは8月23日に開幕したばかりで第1節が8月24日まで、ブンデスリーガは8月28日開幕のため、いずれも順位表を掲載できる段階にありません。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">リヴァプール</span> → <span class=\"team-name\">レバンテ</span>：DF<span class=\"player-name\">イフェアニ・ンドゥクウェ</span>(18歳)が今季いっぱいの期限付き移籍で加入することが正式に発表された。ブレグジット後の労働許可証の規定により<span class=\"team-name\">リヴァプール</span>では公式戦に出場できないため、出場時間を確保して基準を満たす狙いがある。<span class=\"player-name\">イフェアニ・ンドゥクウェ</span>は今夏オーストリア・ウィーンから<span class=\"team-name\">リヴァプール</span>に加入したばかりの2008年ウィーン生まれのセンターバックで、身長2m近い体格と空中戦の強さ、足元の技術を兼ね備える。</div><div class=\"list-item\"><span class=\"team-name\">レバンテ</span> → <span class=\"team-name\">マラガ</span>：MF<span class=\"player-name\">パブロ・マルティネス</span>(28歳)のフリー移籍加入を<span class=\"team-name\">マラガ</span>が正式発表した。契約期間は1年で、さらに1年の延長オプション付き。<span class=\"team-name\">レバンテ</span>との契約は6月30日で満了していた。<span class=\"team-name\">レバンテ</span>では4シーズンで公式戦通算133試合に出場し、キャプテンも務めた。<span class=\"team-name\">マラガ</span>にとっては今夏5人目の補強となる。</div><div class=\"list-item\"><span class=\"team-name\">RBライプツィヒ</span> → <span class=\"team-name\">アタランタ</span>：MF<span class=\"player-name\">エリフ・エルマス</span>(26歳・北マケドニア代表)の期限付き移籍加入を<span class=\"team-name\">アタランタ</span>が正式発表した。レンタル料は100万ユーロで、1100万ユーロの買い取りオプション付き。<span class=\"player-name\">エリフ・エルマス</span>ではセントラルMFとトップ下の両方をこなし、<span class=\"team-name\">ナポリ</span>時代の2022-23シーズンにセリエA制覇を経験している。<span class=\"team-name\">アタランタ</span>のクリスティアーノ・ジュントリSDとは<span class=\"team-name\">ナポリ</span>時代以来の再タッグで、マウリツィオ・サッリ監督の下でプレーするのは初めてとなる。</div>",
    "goalsHtml": "<div class=\"empty-note\">対象期間中、プレミアリーグ・ブンデスリーガ・ラ・リーガ・セリエAでの日本人選手の得点はありませんでした。プレミアリーグ開幕節では<span class=\"team-name\">イプスウィッチ・タウン</span>のFW<span class=\"player-name\">前田大然</span>が左ウイングで先発し約80分間プレーして待望のプレミアデビューを飾りましたが、ゴール・アシストはなくチームは<span class=\"team-name\">サンダーランド</span>に2－1で勝利。<span class=\"team-name\">トッテナム</span>の<span class=\"player-name\">高井幸大</span>は<span class=\"team-name\">ブレントフォード</span>に0－3で敗れ、<span class=\"team-name\">クリスタル・パレス</span>の<span class=\"player-name\">鎌田大地</span>・<span class=\"player-name\">冨安健洋</span>も<span class=\"team-name\">エバートン</span>に0－2で敗れました。<span class=\"team-name\">ハル・シティ</span>の<span class=\"player-name\">守田英正</span>はふくらはぎの負傷でメンバー外でした。ラ・リーガは対象期間中の3試合に日本人選手の出場がなく、セリエAは8月23日に開幕したばかり、ブンデスリーガは8月28日開幕です。</div>"

    "resultsHtml": "<div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\">アーセナルの試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">アーセナル</span> 3－0 <span class=\"team-name\">コヴェントリー</span></div><div>2026－27シーズンのプレミアリーグ開幕節。昨季22年ぶりのリーグ制覇を果たした<span class=\"team-name\">アーセナル</span>が、25年ぶりに昇格した<span class=\"team-name\">コヴェントリー</span>をホームで一蹴した。15分にリッカルド・カラフィオーリのグラウンダークロスから<span class=\"player-name\">カイ・ハヴァーツ</span>が左足ダイレクトで先制。23分には<span class=\"player-name\">クリストス・ツォリス</span>の折り返しのこぼれ球に<span class=\"player-name\">ブカヨ・サカ</span>が反応して追加点を挙げた。後半開始早々の49分には<span class=\"player-name\">ベン・ホワイト</span>のプルバックを<span class=\"player-name\">マルティン・ウーデゴーア</span>が押し込み3点目。ミケル・アルテタ監督はプレミアリーグ通算150勝に到達した。<span class=\"team-name\">コヴェントリー</span>のMF<span class=\"player-name\">坂元達裕</span>はベンチ入りしたものの出場機会がなく、プレミアデビューはお預けとなった。<span class=\"team-name\">アーセナル</span>の次戦は31日のアストン・ヴィラ戦。</div><div class=\"meta\">プレミアリーグ 第1節／2026年8月21日（現地）・エミレーツ・スタジアム</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\">柏レイソルの試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">柏レイソル</span> 4－2 <span class=\"team-name\">V・ファーレン長崎</span></div><div>ACLエリート出場の<span class=\"team-name\">柏レイソル</span>が、三協フロンテア柏スタジアムでの一戦を逆転で制した。6分に<span class=\"player-name\">垣田裕暉</span>が先制したものの、51分・56分と立て続けに失点して逆転を許す苦しい展開。それでも63分に<span class=\"player-name\">小泉佳穂</span>が同点弾、77分に<span class=\"player-name\">瀬川祐輔</span>が勝ち越しゴール、83分には<span class=\"player-name\">弓場堅真</span>がダメを押し、4－2で逆転勝ちを収めた。開幕から3連勝となり、<span class=\"team-name\">柏レイソル</span>は次節29日にアウェイで<span class=\"team-name\">清水エスパルス</span>と対戦する。主力を多数欠いた<span class=\"team-name\">V・ファーレン長崎</span>は3連敗スタートとなった。</div><div class=\"meta\">明治安田J1リーグ 第3節／2026年8月21日 19:03キックオフ・三協フロンテア柏スタジアム</div></div></div><div class=\"empty-note\">その他のトラッキング対象チーム（<span class=\"team-name\">浦和レッズ</span>、<span class=\"team-name\">FC今治</span>、<span class=\"team-name\">タンピネス・ローバーズ</span>、<span class=\"team-name\">アトレティコ・マドリード</span>、日本代表、イングランド代表、および<span class=\"team-name\">鹿島アントラーズ</span>・<span class=\"team-name\">京都サンガF.C.</span>・<span class=\"team-name\">ヴィッセル神戸</span>・<span class=\"team-name\">ガンバ大阪</span>ら日本勢ACLクラブ、<span class=\"team-name\">バルセロナ</span>・<span class=\"team-name\">レアル・マドリード</span>・<span class=\"team-name\">マンチェスター・ユナイテッド</span>・<span class=\"team-name\">マンチェスター・シティ</span>・<span class=\"team-name\">チェルシー</span>・<span class=\"team-name\">リヴァプール</span>・<span class=\"team-name\">バイエルン・ミュンヘン</span>・<span class=\"team-name\">パリ・サンジェルマン</span>）は、対象期間中に試合がありませんでした。J1第3節の残る試合は8月22日〜23日、<span class=\"team-name\">アトレティコ・マドリード</span>のラ・リーガ第2節は8月24日、ブンデスリーガは8月28日開幕です。</div>",
    "standingsHtml": "<div class=\"empty-note\">対象期間中に節が終了したリーグはありませんでした。明治安田J1リーグ第3節は8月21日〜23日にかけて開催中で、対象期間内に終了したのは2試合のみです。プレミアリーグは現地8月21日に第1節が開幕したばかりで、消化は1試合のみ。ラ・リーガも第1節・第2節が分散開催中、セリエAは8月23日、ブンデスリーガは8月28日の開幕を控えており、いずれも順位表を掲載できる段階にありません。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">アストン・ヴィラ</span> → <span class=\"team-name\">アーセナル</span>：DF<span class=\"player-name\">エズリ・コンサ</span>(28歳・イングランド代表)の完全移籍加入を<span class=\"team-name\">アーセナル</span>が正式発表した。背番号は「15」で、契約期間は2030年6月30日までの4年間、さらに1年の延長オプション付き。移籍金はインセンティブを含めて総額5500万ポンド（約119億円）と報じられている。W杯で背中を痛めたDF<span class=\"player-name\">ウィリアン・サリバ</span>(25歳・フランス代表)の長期離脱が濃厚となり、DF<span class=\"player-name\">ユリエン・ティンバー</span>(25歳・オランダ代表)も復調途上にあるなか、CBと右SBの両方をこなせる実力者の獲得に踏み切った。<span class=\"player-name\">エズリ・コンサ</span>は2019年夏にブレントフォードから<span class=\"team-name\">アストン・ヴィラ</span>へ加入し、公式戦通算286試合12得点4アシストを記録。昨季は公式戦48試合出場でUEFAヨーロッパリーグ制覇に貢献した。</div><div class=\"list-item\"><span class=\"team-name\">リヴァプール</span> → <span class=\"team-name\">インテル</span>：MF<span class=\"player-name\">カーティス・ジョーンズ</span>(25歳・イングランド代表)の完全移籍加入を<span class=\"team-name\">インテル</span>が正式発表した。契約期間は2031年6月30日まで。移籍金は3000万ユーロにアドオン500万ユーロを加えた最大3500万ユーロ（約64億円）とされる。<span class=\"team-name\">リヴァプール</span>の下部組織出身で、トップチーム昇格後初のクラブ移籍。<span class=\"team-name\">インテル</span>にとってはDF<span class=\"player-name\">ジョン・ストーンズ</span>(32歳・イングランド代表)、DF<span class=\"player-name\">ジェイデン・スペンス</span>(25歳・イングランド代表)に続く今夏3人目のイングランド代表選手の加入となった。</div>",
    "goalsHtml": "<div class=\"empty-note\">対象期間中、プレミアリーグ・ブンデスリーガ・ラ・リーガ・セリエAでの日本人選手の得点はありませんでした。プレミアリーグ開幕節に唯一絡んだ<span class=\"team-name\">コヴェントリー</span>のMF<span class=\"player-name\">坂元達裕</span>(30歳)はベンチ入りのみで出場なし。ラ・リーガでは<span class=\"team-name\">レアル・ソシエダ</span>の<span class=\"player-name\">久保建英</span>(25歳・日本代表)が今季初戦に先発して見せ場をつくったものの得点はなく、チームは<span class=\"team-name\">レアル・ベティス</span>に敗れて黒星スタートとなりました。セリエAは8月23日、ブンデスリーガは8月28日の開幕を控えています。</div>"

    "resultsHtml": "<div class=\"empty-note\">対象期間中、トラッキング対象チームの試合はありませんでした。国内は明治安田J1リーグ第3節が8月21日19時開始（対象期間終了後）、<span class=\"team-name\">浦和レッズ</span>は8月23日に<span class=\"team-name\">FC町田ゼルビア</span>と対戦します。<span class=\"team-name\">FC今治</span>を含む明治安田J2リーグ第3節も8月22日〜23日開催です。ＪリーグYBCルヴァンカップは9月2日開幕、天皇杯2回戦は対象期間後の開催で、AFCチャンピオンズリーグEliteのリーグステージは9月14日開幕のため<span class=\"team-name\">鹿島アントラーズ</span>・<span class=\"team-name\">柏レイソル</span>・<span class=\"team-name\">京都サンガF.C.</span>・<span class=\"team-name\">ヴィッセル神戸</span>・<span class=\"team-name\">ガンバ大阪</span>の日本勢5クラブにも試合はありません。欧州は<span class=\"team-name\">アーセナル</span>のプレミアリーグ開幕戦（対<span class=\"team-name\">コヴェントリー・シティ</span>）が現地8月21日夜＝日本時間8月22日未明、<span class=\"team-name\">アトレティコ・マドリード</span>は8月19日のラ・リーガ開幕戦を終えて次戦待ち、<span class=\"team-name\">バルセロナ</span>の初戦は8月28日、<span class=\"team-name\">レアル・マドリード</span>は8月27日（いずれも日本時間）。<span class=\"team-name\">パリ・サンジェルマン</span>は8月23日、<span class=\"team-name\">バイエルン・ミュンヘン</span>が戦うブンデスリーガは8月28日開幕、<span class=\"team-name\">マンチェスター・ユナイテッド</span>・<span class=\"team-name\">マンチェスター・シティ</span>・<span class=\"team-name\">チェルシー</span>・<span class=\"team-name\">リヴァプール</span>もプレミアリーグ開幕節は対象期間終了後です。<span class=\"team-name\">日本代表</span>・<span class=\"team-name\">イングランド代表</span>の活動期間外、<span class=\"team-name\">タンピネス・ローバーズ</span>が所属するシンガポール・プレミアリーグは9月11日開幕です。</div>",
    "standingsHtml": "<div class=\"empty-note\">対象期間中に節が終了したリーグはありませんでした。明治安田J1・J2リーグは第3節が8月21日〜23日開催中、プレミアリーグは現地8月21日開幕、セリエAは8月23日開幕、ブンデスリーガは8月28日開幕です。ラ・リーガ2026-27は第1節が8月15日〜28日にかけて分散開催中で、<span class=\"team-name\">レアル・マドリード</span>（8月27日）や<span class=\"team-name\">バルセロナ</span>（8月28日）がまだ初戦を消化していないため、順位表は掲載しません。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">アル・ヒラル</span> → <span class=\"team-name\">バルセロナ</span>：DF<span class=\"player-name\">ジョアン・カンセロ</span>(32歳・ポルトガル代表)の加入が<span class=\"team-name\">バルセロナ</span>から正式発表された。契約期間は2029年6月30日までの3年間。2027年夏まで残っていた<span class=\"team-name\">アル・ヒラル</span>との契約を解除し、フリートランスファーでの完全移籍となった。<span class=\"player-name\">ジョアン・カンセロ</span>は2026年1月に<span class=\"team-name\">アル・ヒラル</span>から期限付き移籍で<span class=\"team-name\">バルセロナ</span>に加入し、約半年間で公式戦23試合に出場して2得点3アシストを記録、ラ・リーガ制覇に貢献していた。今夏の<span class=\"team-name\">バルセロナ</span>にとって5人目の新加入選手となる。</div><div class=\"list-item\"><span class=\"team-name\">アヤックス</span> → <span class=\"team-name\">ボルシア・メンヒェングラートバッハ</span>：DF<span class=\"player-name\">板倉滉</span>(29歳・日本代表)の完全移籍加入が<span class=\"team-name\">ボルシア・メンヒェングラートバッハ</span>から発表された。契約期間は2030年6月30日までの4年間で、背番号は「6」。移籍金は固定350万ユーロ（約6億5000万円）、ボーナス込みで総額400万ユーロ（約7億4000万円）に達する可能性があると報じられている。<span class=\"player-name\">板倉滉</span>は2022年夏に同クラブへ加入して3シーズンで公式戦通算80試合7得点3アシストを記録し、2025年夏に<span class=\"team-name\">アヤックス</span>へ移籍。オランダでは公式戦26試合に出場したが、わずか1年で古巣復帰となった。本人は「戻ってくることができてとても嬉しい。オファーが届いた瞬間に復帰を決めた。まるで家に帰ってきたような気分」とコメントしている。現地報道によれば、<span class=\"player-name\">板倉滉</span>の加入で同クラブに所属する日本人選手は4人となった。</div>",
    "goalsHtml": "<div class=\"empty-note\">対象期間中、プレミアリーグ・ブンデスリーガ・ラ・リーガ・セリエAでの日本人選手の得点はありませんでした。プレミアリーグ（現地8月21日開幕）、セリエA（8月23日開幕）、ブンデスリーガ（8月28日開幕）はいずれも2026-27シーズンが未開幕で、ラ・リーガも第1節の分散開催中で対象期間内の試合はありませんでした。なお対象4リーグ外では、UEFAヨーロッパリーグ・プレーオフで<span class=\"team-name\">シント・トロイデン</span>の<span class=\"player-name\">谷口彰悟</span>(35歳・日本代表)が後半アディショナルタイムに決勝ゴール、UEFAヨーロッパカンファレンスリーグ・プレーオフで<span class=\"team-name\">フライブルク</span>の<span class=\"player-name\">後藤啓介</span>(21歳)が公式戦デビュー戦でヘディング弾を記録しています。</div>"

    "resultsHtml": "<div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">アトレティコ・マドリード</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">アトレティコ・マドリード</span> 2 - 0 <span class=\"team-name\">マラガ</span></div><div><span class=\"team-name\">アトレティコ・マドリード</span>が2026-27シーズンの公式戦初戦を完封勝利で飾った。北中米ワールドカップ決勝に9人が参加した影響でシメオネ監督は主力を温存し、バルセロナ移籍の噂がくすぶる<span class=\"player-name\">フリアン・アルバレス</span>(26歳・アルゼンチン代表)は調整不足を理由にベンチ外。<span class=\"player-name\">オブラク</span>(33歳・スロベニア代表)、<span class=\"player-name\">コケ</span>(34歳・元スペイン代表)、<span class=\"player-name\">パブロ・バリオス</span>(24歳・スペイン代表)らを軸にした5-4-1でスタートし、1トップには<span class=\"player-name\">アデモラ・ルックマン</span>(28歳・ナイジェリア代表)が入った。前半はアタッキングサードでの精度を欠いてスコアレス。57分に<span class=\"player-name\">アレックス・バエナ</span>(25歳・スペイン代表)、<span class=\"player-name\">イ・ガンイン</span>(25歳・韓国代表)、<span class=\"player-name\">ジュリアーノ・シメオネ</span>(23歳・アルゼンチン代表)を同時投入すると流れが変わり、70分、今夏PSGから移籍金3500万ユーロで加入しグリーズマンの背番号7を継承した<span class=\"player-name\">イ・ガンイン</span>が右サイドからカットインして左足を一閃、強烈なミドルシュートを突き刺して均衡を破った。<span class=\"player-name\">イ・ガンイン</span>は<span class=\"team-name\">アトレティコ・マドリード</span>史上初のアジア人得点者となった。85分にはペナルティーエリア手前からのFKを<span class=\"player-name\">アレックス・バエナ</span>が壁越しに枠左上へ沈めて追加点。なお16歳241日でデビューしたCB<span class=\"player-name\">ホルヘ・ドミンゲス</span>(16歳)はクラブ史上最年少公式戦出場記録を更新した。<span class=\"team-name\">マラガ</span>は8年ぶりの1部復帰初戦を落とした。</div><div class=\"meta\">ラ・リーガ 第1節／2026年8月20日(日本時間未明)／エスタディオ・メトロポリターノ</div></div></div>",

    "resultsHtml": "<div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">柏レイソル</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">東京ヴェルディ</span> 1 - 3 <span class=\"team-name\">柏レイソル</span></div><div>2026/27シーズンJ1第2節。<span class=\"team-name\">東京ヴェルディ</span>は前半2分、<span class=\"player-name\">林 尚輝</span>がセットプレーからヘディングで先制し、国立（ＭＵＦＧスタジアム）の大観衆を沸かせた。しかし<span class=\"team-name\">柏レイソル</span>は同11分、<span class=\"player-name\">遠藤 渓太</span>がペナルティエリア手前から右足でゴール右下へ突き刺して同点。後半に入っても<span class=\"team-name\">柏レイソル</span>が主導権を握り、後半20分に途中出場の<span class=\"player-name\">瀬川 祐輔</span>が<span class=\"player-name\">渡井 理己</span>のアシストからエリア手前で右足を振り抜いて勝ち越し、後半37分には<span class=\"player-name\">久保 藤次郎</span>がエリア中央から右足でゴール左下へ流し込んでダメを押した。<span class=\"team-name\">柏レイソル</span>は開幕2連勝でACLエリート出場クラブとしての好スタートを継続。<span class=\"team-name\">東京ヴェルディ</span>は開始早々のリードを守り切れず、今季初勝利はまたも持ち越しとなった。シュート数は<span class=\"team-name\">東京ヴェルディ</span>4本に対し<span class=\"team-name\">柏レイソル</span>11本、入場者数は44,690人だった。</div><div class=\"meta\">明治安田J1リーグ 第2節 ／ 2026年8月14日(金) 19:00 KO ／ ＭＵＦＧスタジアム ／ 得点: <span class=\"player-name\">林 尚輝</span>2分、<span class=\"player-name\">遠藤 渓太</span>11分、<span class=\"player-name\">瀬川 祐輔</span>65分、<span class=\"player-name\">久保 藤次郎</span>82分</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">アトレティコ・マドリード</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">オリンピック・マルセイユ</span> 1 - 2 <span class=\"team-name\">アトレティコ・マドリード</span></div><div>2026/27シーズン開幕前、最後のプレシーズンマッチ。ホームの<span class=\"team-name\">オリンピック・マルセイユ</span>が前半21分、<span class=\"player-name\">イゴール・パイシャン</span>が<span class=\"team-name\">アトレティコ・マドリード</span>のGK<span class=\"player-name\">ヤン・オブラク</span>の頭上を越すループシュートを沈めて先制した。しかし後半、途中出場の<span class=\"player-name\">ロドリゴ・メンドーサ</span>が<span class=\"player-name\">アデモラ・ロオクマン</span>のボール奪取からのパスを受け、エリア内で冷静に流し込んで同点。さらに<span class=\"player-name\">カルロス・マルティン</span>が決勝点を挙げ、<span class=\"team-name\">アトレティコ・マドリード</span>が逆転勝利でプレシーズンを締めくくった。ディエゴ・シメオネ監督にとっては、リーガ開幕を前に守備陣とアタッカー陣の連係を確認する一戦となった。</div><div class=\"meta\">プレシーズン親善試合 ／ 2026年8月14日(現地・日本時間8月15日未明) ／ スタッド・ヴェロドローム(マルセイユ)</div></div></div><div class=\"empty-note\">この2試合以外に、トラッキング対象チームの試合は対象期間内にありませんでした。J1第2節の残り9試合（<span class=\"team-name\">浦和レッズ</span>対<span class=\"team-name\">サンフレッチェ広島</span>を含む）は8月15日18:00以降のキックオフ、J2第2節の<span class=\"team-name\">FC今治</span>対<span class=\"team-name\">RB大宮アルディージャ</span>戦も8月15日以降で、いずれも対象期間外です。ACLエリート2026/27に出場する<span class=\"team-name\">鹿島アントラーズ</span>・<span class=\"team-name\">ヴィッセル神戸</span>・<span class=\"team-name\">京都サンガF.C.</span>・<span class=\"team-name\">ガンバ大阪</span>も8月15日以降の開催。<span class=\"team-name\">アーセナル</span>は8月16日のコミュニティ・シールド、<span class=\"team-name\">レアル・マドリード</span>は8月16日の<span class=\"team-name\">シャルケ04</span>戦、<span class=\"team-name\">チェルシー</span>・<span class=\"team-name\">マンチェスター・ユナイテッド</span>・<span class=\"team-name\">マンチェスター・シティ</span>は8月15日夜（日本時間8月16日未明）のプレシーズン最終戦が次戦です。<span class=\"team-name\">バイエルン・ミュンヘン</span>は8月15日に<span class=\"team-name\">リーズ・ユナイテッド</span>戦、<span class=\"team-name\">パリ・サンジェルマン</span>のリーグ・アン開幕は8月24日（8月17日にトロフェ・デ・シャンピオン）。<span class=\"team-name\">タンピネス・ローバーズ</span>、<span class=\"team-name\">日本代表</span>、<span class=\"team-name\">イングランド代表</span>はこの期間の試合はありませんでした。</div>",
    "standingsHtml": "<div class=\"empty-note\">対象期間中に節が終了したリーグはありません。J1・J2第2節は8月14日〜16日の開催中で、8月14日時点で消化されたのは東京V対柏の1試合のみのため、順位表の更新は第2節終了後に掲載します。プレミアリーグ（8月21日開幕）、ブンデスリーガ（8月28日開幕）、リーガ・エスパニョーラ、セリエAはいずれも2026/27シーズン開幕前で、順位表はまだ存在しません。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">アトレティコ・マドリード</span> が <span class=\"team-name\">トッテナム・ホットスパー</span> から <span class=\"player-name\">クリスティアン・ロメロ</span>(28歳・アルゼンチン代表) の獲得を正式に完了させた。移籍金は各種ボーナスを含めて約4000万ユーロ（約3420万ポンド）で、契約は2031年6月までの5年間。<span class=\"team-name\">トッテナム・ホットスパー</span> は15%のセルオン条項を確保した。<span class=\"player-name\">クリスティアン・ロメロ</span> は前所属クラブでキャプテンを務め、2025年のヨーロッパリーグ制覇に貢献。2026年ワールドカップでは母国を準優勝に導いた。同じアルゼンチン人であるディエゴ・シメオネ監督のもと、<span class=\"team-name\">アトレティコ・マドリード</span> の最終ラインを 支える中心選手となる。<span class=\"team-name\">インテル・ミラノ</span> と <span class=\"team-name\">アーセナル</span> も獲得に動いていたが、いずれも実らなかった。</div><div class=\"list-item\"><span class=\"team-name\">インテル・ミラノ</span> が <span class=\"team-name\">トッテナム・ホットスパー</span> から <span class=\"player-name\">ジェド・スペンス</span>(26歳・イングランド代表) を獲得。移籍金は3150万ユーロ（ボーナス含む）で、契約は2031年まで、将来の移籍時に10%のセルオン条項が付く。右サイドバックを主戦場とする万能型で、<span class=\"team-name\">レアル・マドリード</span> へ移籍した <span class=\"player-name\">デンゼル・ダンフリース</span> の後釜として期待される。</div><div class=\"list-item\"><span class=\"team-name\">インテル・ミラノ</span> が <span class=\"player-name\">ダヴィデ・フラッテージ</span>(26歳・イタリア代表) の <span class=\"team-name\">ラツィオ</span> への期限付き移籍を決定した。買い取りオプション付きの1年契約で、出場機会を求めての国内移籍となる。ゴール前への飛び出しを武器とするインサイドハーフで、<span class=\"team-name\">インテル・ミラノ</span> では出場時間が限られていた。</div><div class=\"list-item\"><span class=\"team-name\">セルティック</span> が <span class=\"team-name\">SCパーダーボルン07</span> から <span class=\"player-name\">ミカ・バウアー</span>(22歳・ドイツU-21代表) の完全移籍加入を公式発表した。契約は2030年までの4年間（延長オプション付き）。移籍金は初期費用525万ユーロ＋ボーナス275万ユーロの総額800万ユーロで、<span class=\"team-name\">SCパーダーボルン07</span> にとってクラブ史上最高額の売却となった。攻撃的MFを本職とし、2部リーグで評価を高めていた逸材。</div>",

ス</span>が決めて1点差に迫ったものの、追いつけずに終了。試合後のPK戦は<span class=\"team-name\">アーセナル</span>が5－4で制したが、カップを掲げたのは<span class=\"team-name\">ボルシア・ドルトムント</span>だった。</div><div class=\"meta\">エミレーツ・カップ2026（プレシーズン大会）／2026年8月9日／エミレーツ・スタジアム</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">リバプール</span>対<span class=\"team-name\">モナコ</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">リバプール</span> 2－3 <span class=\"team-name\">モナコ</span></div><div>アンフィールドでのプレシーズンマッチ。16分に<span class=\"player-name\">アレクサンデル・イサク</span>が均衡を破ると、直後に<span class=\"player-name\">フロリアン・ヴィルツ</span>が冷静に流し込んで<span class=\"team-name\">リバプール</span>が2点をリード。しかし前半終了間際に<span class=\"team-name\">モナコ</span>の<span class=\"player-name\">アレクサンドル・ゴロビン</span>がPKを沈めると、55分に<span class=\"player-name\">ミカ・ビエレト</span>が同点。終盤には<span class=\"player-name\">パリス・ブルンナー</span>が決勝点を奪い、<span class=\"team-name\">モナコ</span>が逆転勝ちを収めた。<span class=\"team-name\">リバプール</span>を率いる<span class=\"player-name\">アンドニ・イラオラ</span>監督はアンフィールド初采配を黒星で終えている。</div><div class=\"meta\">クラブ親善試合／2026年8月9日／アンフィールド</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">ジョホール・ダルル・タクジム</span>対<span class=\"team-name\">チェルシー</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">ジョホール・ダルル・タクジム</span> 3－3 <span class=\"team-name\">チェルシー</span></div><div>マレーシアで行われたプレシーズンマッチは打ち合いの末にドロー。<span class=\"team-name\">チェルシー</span>は<span class=\"player-name\">リアム・デラップ</span>が2得点を挙げ、さらに相手のオウンゴールも誘った。対する<span class=\"team-name\">ジョホール・ダルル・タクジム</span>は<span class=\"player-name\">ベルグソン</span>のロングシュートと<span class=\"player-name\">オスカル・アリバス</span>の直接FKなどで3点を奪い、プレミアリーグ勢と互角に渡り合     "resultsHtml": "<div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">横浜F・マリノス</span>対<span class=\"team-name\">鹿島アントラーズ</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">横浜F・マリノス</span> 3－4 <span class=\"team-name\">鹿島アントラーズ</span></div><div>秋春制へ移行した2026/27シーズンの開幕カード。7分に<span class=\"team-name\">横浜F・マリノス</span>の<span class=\"player-name\">三井寺眞</span>が16歳4カ月5日でJ1史上2番目の年少記録となるゴールを挙げ先制すると、11分に<span class=\"team-name\">鹿島アントラーズ</span>の<span class=\"player-name\">レオ・セアラ</span>が<span class=\"player-name\">小川諒也</span>のFKに合わせて同点。18分と58分に<span class=\"player-name\">谷村海那</span>が2ゴールを決めて<span class=\"team-name\">横浜F・マリノス</span>が突き放したが、81分に<span class=\"player-name\">レオ・セアラ</span>が押し込んで1点差とすると、後半アディショナルタイムに<span class=\"player-name\">アレクサンダル・チャヴリッチ</span>がPKで同点、さらに90＋13分にも決めて<span class=\"team-name\">鹿島アントラーズ</span>が土壇場で逆転した。</div><div class=\"meta\">2026/27明治安田J1リーグ 第1節／2026年8月7日 19:25キックオフ／MUFG国立競技場（<span class=\"team-name\">鹿島アントラーズ</span>はACL Elite 2026/27出場クラブ）</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">ガンバ大阪</span>対<span class=\"team-name\">浦和レッズ</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">ガンバ大阪</span> 4－3 <span class=\"team-name\">浦和レッズ</span></div><div>“ナショナルダービー”は7ゴールの乱打戦。17分に<span class=\"team-name\">浦和レッズ</span>の<span class=\"player-name\">小森飛絢</span>が<span class=\"player-name\">金子拓郎</span>のクロスから先制したが、22分に<span class=\"player-name\">マテウス・サヴィオ</span>が2枚目の警告で退場し<span class=\"team-name\">浦和レッズ</span>は10人に。36分に<span class=\"player-name\">イッサム・ジェバリ</span>、45＋7分に<span class=\"player-name\">デニス・ヒュメット</span>が決めて<span class=\"team-name\">ガンバ大阪</span>が前半のうちに逆転した。78分に<span class=\"player-name\">金子拓郎</span>、80分に古巣対戦の<span class=\"player-name\">南野遥海</span>が決めて<span class=\"team-name\">浦和レッズ</span>が再逆転するも、84分に<span class=\"player-name\">ウェルトン</span>、86分に<span class=\"player-name\">植中朝日</span>が立て続けにゴールを挙げ、<span class=\"team-name\">ガンバ大阪</span>が競り勝った。</div><div class=\"meta\">2026/27明治安田J1リーグ 第1節／2026年8月7日 19:30キックオフ／パナソニック スタジアム 吹田（<span class=\"team-name\">ガンバ大阪</span>はACL Elite 2026/27プレリミナリーステージ出場クラブ）</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">バイエルン・ミュンヘン</span>対<span class=\"team-name\">アストン・ヴィラ</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">バイエルン・ミュンヘン</span> 2－1 <span class=\"team-name\">アストン・ヴィラ</span></div><div>香港で行われたプレシーズンマッチ。37分に<span class=\"team-name\">バイエルン・ミュンヘン</span>の<span class=\"player-name\">キム・ミンジェ</span>が先制し、74分には<span class=\"player-name\">ルイス・ディアス</span>が加点。83分に<span class=\"team-name\">アストン・ヴィラ</span>の<span class=\"player-name\">ジョアン・ゴメス</span>が1点を返したが、<span class=\"team-name\">バイエルン・ミュンヘン</span>が逃げ切った。日本代表DF<span class=\"player-name\">伊藤洋輝</span>は途中出場した。</div><div class=\"meta\">クラブ親善試合／2026年8月7日 現地20:00＝日本時間21:00キックオフ／香港・啓徳スポーツパーク</div></div></div><div class=\"empty-note\">対象期間中、この3試合以外にトラッキング対象チームの試合はありませんでした。2026/27明治安田J1リーグ第1節の残り8試合（<span class=\"team-name\">柏レイソル</span>、<span class=\"team-name\">ヴィッセル神戸</span>、<span class=\"team-name\">FC町田ゼルビア</span>、<span class=\"team-name\">京都サンガF.C.</span>を含む）は8月8日19:00以降、<span class=\"team-name\">FC今治</span>の2026/27明治安田J2リーグ開幕戦（<span class=\"team-name\">いわきFC</span>戦）は8月9日で、いずれも次回の集計対象となります。また<span class=\"team-name\">チェルシー</span>対<span class=\"team-name\">ACミラン</span>（ジャカルタ）、<span class=\"team-name\">パリ・サンジェルマン</span>対<span class=\"team-name\">マンチェスター・U</span>（ヨーテボリ）、<span class=\"team-name\">バルセロナ</span>が参加するウディネでの大会は8月8日の日本時間夕方以降、<span class=\"team-name\">アーセナル</span>対<span class=\"team-name\">ボルシア・ドルトムント</span>（エミレーツ）、<span class=\"team-name\">マンチェスター・C</span>対<span class=\"team-name\">アトレティコ・マドリード</span>（ソウル）、<span class=\"team-name\">リバプール</span>対<span class=\"team-name\">モナコ</span>（アンフィールド）は8月9日の開催です。<span class=\"team-name\">タンピネス・ローバーズ</span>はシンガポール・プレミアリーグのオフシーズン中、<span class=\"team-name\">日本代表</span>・<span class=\"team-name\">イングランド代表</span>は8月に代表ウィークがないため試合はありません。</div>",
    "standingsHtml": "<div class=\"empty-note\">対象期間中に節が終了したリーグはありませんでした。2026/27明治安田J1リーグは第1節の10試合中2試合を消化した段階（残り8試合は8月8日・9日開催）で、節が終了していません。プレミアリーグは8月21日、リーガ・エスパニョーラは8月23日に開幕予定で、ブンデスリーガ・セリエAもプレシーズン期間中のため、順位表の更新はありません。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">セルタ・ビーゴ</span>が、<span class=\"team-name\">マンチェスター・U</span>のGK<span class=\"player-name\">アルタイ・バユンドゥル</span>(28歳・トルコ代表)を今シーズン終了までの期限付き移籍で獲得したと発表した。<span class=\"player-name\">アルタイ・バユンドゥル</span>は2023年夏に<span class=\"team-name\">フェネルバフチェ</span>（トルコ）から<span class=\"team-name\">マンチェスター・U</span>へ加入し、正GKと控えを行き来する立場が続いていた。ラ・リーガでの出場機会確保を目指し、スペインへ渡る。</div><div class=\"list-item\"><span class=\"team-name\">フィオレンティーナ</span>が、<span class=\"team-name\">レアル・マドリード</span>のMF<span class=\"player-name\">フランコ・マスタントゥオーノ</span>(18歳・アルゼンチン代表)を2027年6月30日までの期限付き移籍で獲得したと発表した。買い取りオプションや延長オプションは付帯せず、年俸は両クラブで折半される。<span class=\"player-name\">フランコ・マスタントゥオーノ</span>は2025年夏に<span class=\"team-name\">リーベル・プレート</span>（アルゼンチン）から約4500万ユーロで<span class=\"team-name\">レアル・マドリード</span>へ加入したが、1年目は公式戦35試合・先発17試合で3ゴールにとどまった。<span class=\"team-name\">レアル・マドリード</span>の<span class=\"player-name\">ヤン・ディオマンデ</span>獲得や<span class=\"player-name\">ヴィニシウス・ジュニオール</span>の契約延長により序列がさらに下がっていた。</div><div class=\"list-item\"><span class=\"team-name\">コモ</span>が、<span class=\"team-name\">ボルシア・ドルトムント</span>のDF<span class=\"player-name\">ヤン・クトー</span>(24歳・ブラジル代表)を期限付き移籍で獲得したと発表した。レンタル料は200万ユーロで、2000万ユーロの買い取りオプションが付帯する。<span class=\"player-name\">ヤン・クトー</span>は過去2シーズンで<span class=\"team-name\">ボルシア・ドルトムント</span>ではブンデスリーガ40試合、チャンピオンズリーグ15試合に出場していた。<span class=\"team-name\">コモ</span>にとって今夏4人目の新戦力となる。</div><div class=\"list-item\"><span class=\"team-name\">シャルケ04</span>が、<span class=\"team-name\">アイントラハト・フランクフルト</span>のMF<span class=\"player-name\">エリック・ジュニオール・ディナ・エビンベ</span>(25歳)を完全移籍で獲得したと発表した。移籍金は70万ユーロと報じられている。<span class=\"player-name\">エリック・ジュニオール・ディナ・エビンベ</span>は2022年夏に<span class=\"team-name\">パリ・サンジェルマン</span>（フランス）から<span class=\"team-name\">アイントラハト・フランクフルト</span>へ加入し、ブンデスリーガでプレーを続けてきた。</div><div class=\"empty-note\">Jリーグ（J1・J2）および<span class=\"team-name\">FC今治</span>に関する新たな公式発表は、対象期間中にはありませんでした。</div>",
    "goalsHtml": "<div class=\"empty-note\">対象期間中、プレミアリーグ・ブンデスリーガ・リーガ・エスパニョーラ・セリエAはいずれも開幕前（プレミアは8月21日、リーガは8月23日開幕予定）で公式戦が行われていないため、日本人選手のゴールはありませんでした。なお<span class=\"team-name\">バイエルン・ミュンヘン</span>の日本代表DF<span class=\"player-name\">伊藤洋輝</span>は、8月7日の<span class=\"team-name\">アストン・ヴィラ</span>戦（香港／プレシーズンマッチ）に途中出場しています。</div>"
  },

    "standingsHtml": "<div class=\"empty-note\">対象期間中に節が終了したリーグはありませんでした。2026/27明治安田Jリーグは開幕当日（J1は8月7日夜、J2・J3は8月8日以降）で第1節がまだ終了しておらず、プレミアリーグは8月21日、リーガ・エスパニョーラは8月23日に開幕予定。ブンデスリーガ・セリエAもプレシーズン期間中のため、順位表の更新はありません。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">レアル・マドリード</span>が、<span class=\"team-name\">ライプツィヒ</span>のFW<span class=\"player-name\">ヤン・ディオマンデ</span>(19歳・コートジボワール代表)の獲得で合意に達したと正式発表した。契約期間は2033年6月30日までの7年間。スペイン紙『アス』などによれば移籍金は1億2500万ユーロ（約227億円）に加え、成績に応じたボーナス最大1500万ユーロ（約27億円）が付帯し、<span class=\"team-name\">レアル・マドリード</span>にとってクラブ史上最高額の補強となる。<span class=\"player-name\">ヤン・ディオマンデ</span>は2025年夏に<span class=\"team-name\">レガネス</span>から<span class=\"team-name\">ライプツィヒ</span>へステップアップすると、2025-26シーズンは公式戦36試合で13ゴール10アシストを記録。今夏のFIFAワールドカップ2026でもコートジボワール代表として4試合に出場し、決勝トーナメント進出に貢献していた。<span class=\"team-name\">パリ・サンジェルマン</span>や<span class=\"team-name\">リバプール</span>も獲得を争っていた。</div><div class=\"list-item\"><span class=\"team-name\">レアル・マドリード</span>が、FW<span class=\"player-name\">ヴィニシウス・ジュニオール</span>(26歳・ブラジル代表)との契約を2032年6月30日まで延長したと発表した。契約詳細は非公表だが、スペイン『カデナ・セール』などは基本年俸2200万ユーロ（約40億円）＋成績連動ボーナス200万ユーロ（約4億円）と報じている。既存契約が2027年6月末で満了予定だったため、<span class=\"team-name\">アーセナル</span>がクラブ史上最大級の条件を用意して獲得に動いていると伝えられていたが、今回の延長で一連の移籍報道は収束した。<span class=\"player-name\">ヴィニシウス・ジュニオール</span>は2018年夏に<span class=\"team-name\">フラメンゴ</span>から加入し、公式戦通算375試合128ゴール100アシスト、チャンピオンズリーグ2回・ラ・リーガ3回を含む通算14タイトルに貢献している。</div><div class=\"list-item\"><span class=\"team-name\">ASローマ</span>のDF<span class=\"player-name\">アンヘリーニョ</span>(29歳・スペイン代表)が、今季ラ・リーガに昇格した古巣<span class=\"team-name\">デポルティーボ・ラ・コルーニャ</span>へ買い取りオプション付きの期限付き移籍で加入することが決まった。レンタル料は発生せず、買い取りオプションは250万ユーロに設定されている。<span class=\"player-name\">アンヘリーニョ</span>は2024年1月に<span class=\"team-name\">ライプツィヒ</span>から<span class=\"team-name\">ASローマ</span>へ加入していた。</div><div class=\"empty-note\">上記以外に、対象範囲（J1・J2＋トラッキング対象クラブ、および海外各国1部リーグ）で新たに正式発表された移籍はありませんでした。<span class=\"team-name\">セレッソ大阪</span>による<span class=\"team-name\">FCザンクトパウリ</span>のMF<span class=\"player-name\">ジャクソン・アーバイン</span>(33歳・オーストラリア代表)の完全移籍獲得は、クラブ公式発表が8月5日18:00で今回の集計期間より前のため本欄では扱っていません。<span class=\"team-name\">浦和レッズ</span>による<span class=\"team-name\">ロサンゼルス・ギャラクシー</span>のDF<span class=\"player-name\">山根視来</span>(32歳・元日本代表)獲得、<span class=\"team-name\">アーセナル</span>と<span class=\"team-name\">ニューカッスル・ユナイテッド</span>のMF<span class=\"player-name\">ブルーノ・ギマランイス</span>(28歳・ブラジル代表)の合意報道、<span class=\"team-name\">レアル・マドリード</span>のMF<span class=\"player-name\">フランコ・マスタントゥオーノ</span>(18歳・アルゼンチン代表)の<span class=\"team-name\">フィオレンティーナ</span>行きは、いずれもクラブ間交渉・合意段階の報道にとどまり、公式発表が確認できないため掲載していません。</div>",

am-name\">マンチェスター・U</span> 2 - 1 <span class=\"team-name\">アトレティコ・マドリード</span></div><div>スカンジナビア遠征中の<span class=\"team-name\">マンチェスター・U</span>と、プレシーズン2戦目の<span class=\"team-name\">アトレティコ・マドリード</span>がストックホルムで対戦。5分、<span class=\"player-name\">アルナウ・オルティス</span>(24歳)のクロスが誰にも触れられずそのままゴールに吸い込まれるという幸運な形で<span class=\"team-name\">アトレティコ・マドリード</span>が先制した。しかし前半は<span class=\"team-name\">マンチェスター・U</span>がポゼッション57%・シュート8本と押し込み、後半53分に<span class=\"player-name\">シェイ・レイシー</span>が獲得したPKを<span class=\"player-name\">ブライアン・ムベウモ</span>(26歳・カメルーン代表)が決めて同点。74分には<span class=\"player-name\">ジャック・フレッチャー</span>の折り返しを再び<span class=\"player-name\">ムベウモ</span>がニアで押し込み逆転した。<span class=\"player-name\">ディエゴ・シメオネ</span>監督は61分に先発全員を入れ替えている。両軍ともW杯明けの主力を欠く布陣だった。</div><div class=\"meta\">親善試合（プレシーズン）／2026年8月1日・ストロベリー・アリーナ（ストックホルム／ソルナ）</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">マンチェスター・C</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">マンチェスター・C</span> 1 - 1（PK戦 1-3）<span class=\"team-name\">インテル</span></div><div>香港フットボールフェスティバルの開幕戦。14分、<span class=\"player-name\">アントワーヌ・セメンヨ</span>のクロスを<span class=\"player-name\">ディヴィン・ムバマ</span>がゴール前で押し込んで<span class=\"team-name\">マンチェスター・C</span>が先制したが、その6分後に<span class=\"player-name\">バンジャマン・パヴァール</span>(30歳・フランス代表)にペナルティエリア内から同点弾を許した。1-1で突入したPK戦では<span class=\"player-name\">アイト・ヌーリ</span>と<span class=\"player-name\">フサノフ</span>が失敗し、<span class=\"player-name\">クラウディオ・エチェベリ</span>のみが成功。<span class=\"team-name\">インテル</span>が3-1で制した。観衆は42,826人。</div><div class=\"meta\">親善試合（香港フットボールフェスティバル）／2026年8月1日・香港</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">チェルシー</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">チェルシー</span> 1 - 2 <span class=\"team-name\">トッテナム</span></div><div>シドニーのアコー・スタジアムに80,363人の超満員を集めたロンドン勢対決。<span class=\"player-name\">サンドロ・トナーリ</span>(26歳・イタリア代表)が先制点を挙げると、前半のうちに<span class=\"player-name\">エステヴァン</span>が同点に追いついた。後半に<span class=\"team-name\">トッテナム</span>の<span class=\"player-name\">ケヴィン・ダンソ</span>(27歳・オーストリア代表)が退場して10人となったが、後半アディショナルタイム92分、<span class=\"player-name\">ジェイミー・ドンリー</span>のシュートがポストに跳ね返ったこぼれ球に<span class=\"player-name\">リシャルリソン</span>(29歳・ブラジル代表)が詰めて決勝点。<span class=\"player-name\">ロベルト・デ・ゼルビ</span>監督率いる<span class=\"team-name\">トッテナム</span>はプレシーズン4連勝となった。</div><div class=\"meta\">親善試合（プレシーズン）／2026年8月1日・アコー・スタジアム（シドニー）</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">レアル・マドリード</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">レアル・マドリード</span> 2 - 2 <span class=\"team-name\">フィオレンティーナ</span></div><div>オーストリア・クラーゲンフルトでの一戦。W杯からブラジル代表として戻ってきた<span class=\"player-name\">エンドリック</span>(20歳・ブラジル代表)が12分に反転から鮮やかに決めて先制し、24分には18歳のウインガー<span class=\"player-name\">アレクシス・シリア</span>が続いて2-0とした。しかし前半41分に<span class=\"player-name\">ロベルト・ピッコリ</span>(25歳)に角度のないところから突き刺され、後半58分には<span class=\"player-name\">ニコロ・ファジョーリ</span>(25歳)のクロスを<span class=\"player-name\">モイーズ・ケーン</span>(26歳・イタリア代表)がヘディングで合わせて同点。復帰2季目の<span class=\"player-name\">ジョゼ・モウリーニョ</span>監督にとって今夏初めて勝てなかった試合となった。<span class=\"team-name\">レアル・マドリード</span>は<span class=\"player-name\">キリアン・エムバペ</span>ら多くのW杯組を欠いていた。</div><div class=\"meta\">親善試合（プレシーズン）／2026年8月1日・ヴェルターゼー・シュタディオン（クラーゲンフルト）</div></div></div><div class=\"match-card\"><div class=\"match-teaser\" onclick=\"toggleMatch(this)\"><div class=\"match-teaser-text\"><span class=\"team-name\">バルセロナ</span>の試合がありました。結果を見る</div><div class=\"match-teaser-hint\">TAP TO REVEAL</div></div><div class=\"match-detail\"><div class=\"score\"><span class=\"team-name\">バーミンガム・シティ</span> 2 - 2（PK戦 3-2）<span class=\"team-name\">バルセロナ</span></div><div>ラ・リーガ王者<span class=\"team-name\">バルセロナ</span>がイングランド2部の<span class=\"team-name\">バーミンガム・シティ</span>の本拠地セント・アンドルーズに乗り込んだプレシーズンマッチ。31分に<span class=\"player-name\">アウグスト・プリスケ</span>のヘディングで先行された<span class=\"team-name\">バルセロナ</span>は、41分に<span class=\"player-name\">ハムザ・アブデルカリム</span>がPKで同点とし、後半60分にも同選手が至近距離から押し込んで逆転。しかし<span class=\"player-name\">ジョン・ソリス</span>に追いつかれ、2-2からのPK戦では5人中3人が失敗して3-2で敗れた。<span class=\"team-name\">バーミンガム・シティ</span>のGK<span class=\"player-name\">ジェームズ・ビードル</span>が2本をセーブしてマン・オブ・ザ・マッチに輝いた。観衆28,366人。</div><div class=\"meta\">親善試合（プレシーズン）／2026年7月31日・セント・アンドルーズ（バーミンガム）</div></div></div><div class=\"empty-note\">対象期間中、<span class=\"team-name\">リバプール</span>、<span class=\"team-name\">バイエルン・ミュンヘン</span>、<span class=\"team-name\">PSG</span>、<span class=\"team-name\">FC今治</span>、ACL出場の<span class=\"team-name\">ヴィッセル神戸</span>・<span class=\"team-name\">鹿島アントラーズ</span>・<span class=\"team-name\">京都サンガF.C.</span>・<span class=\"team-name\">ガンバ大阪</span>・<span class=\"team-name\">FC町田ゼルビア</span>に公式・非公式を問わず確認できる試合はありませんでした。日本代表・イングランド代表も国際Aマッチウィーク外のため活動はありません。</div>",
    "standingsHtml": "<div class=\"empty-note\">対象期間中に節が終了したリーグはありませんでした。2026/27明治安田Jリーグは開幕前（J1は8月7日、J2・J3は8月8日開幕）、プレミアリーグは8月21日開幕、ブンデスリーガ・リーガ・エスパニョーラ・セリエAもいずれもプレシーズン期間中のため、順位表の更新はありません。</div>",
    "transfersHtml": "<div class=\"list-item\"><span class=\"team-name\">チェルシー</span>（プレミアリーグ）：<span class=\"team-name\">ブライトン</span>（プレミアリーグ）より<span class=\"player-name\">ダニー・ウェルベック</span>(35歳・元イングランド代表)が完全移籍で加入。契約は2年で、移籍金は非公表（英メディアは約500万ポンドと報道）。<span class=\"player-name\">マンチェスター・U</span>の下部組織出身でイングランド代表42キャップを誇るベテランFWは、昨季プレミアリーグ37試合13得点と結果を残していた。すぐに<span class=\"player-name\">シャビ・アロンソ</span>監督率いるチームの香港でのプレシーズンツアーに合流する。</div><div class=\"list-item\"><span class=\"team-name\">ブレントフォード</span>（プレミアリーグ）：<span class=\"team-name\">ランス</span>（リーグ・アン）より<span class=\"player-name\">ママドゥ・サンガレ</span>(24歳・マリ代表)が完全移籍で加入。移籍金は約3900万ポンドでクラブ史上最高額、契約は5年（＋1年オプション）。昨季は<span class=\"team-name\">ランス</span>のリーグ・アン2位とクラブ史上初のクープ・ドゥ・フランス制覇に貢献し、リーグ・アン年間ベストイレブンとアフリカ最優秀選手賞（マルク＝ヴィヴィアン・フォエ賞）に選ばれた。</div><div class=\"list-item\"><span class=\"team-name\">バルセロナ</span>（リーガ・エスパニョーラ）：<span class=\"team-name\">クラブ・ブルージュ</span>（ベルギー・ジュピラー・プロ・リーグ）より<span class=\"player-name\">ジェシー・ビシウ</span>(18歳)が完全移籍で加入。移籍金は約850万ユーロで、契約は2031年6月30日まで。まずは<span class=\"team-name\">バルサ・アトレティック</span>に登録される快足ウインガー。</div><div class=\"list-item\"><span class=\"team-name\">フィオレンティーナ</span>（セリエA）：<span class=\"team-name\">レアル・マドリード</span>（リーガ・エスパニョーラ）より<span class=\"player-name\">ビクトル・バルデペーニャス</span>(19歳)が完全移籍で加入。移籍金は約800万ユーロ。<span class=\"team-name\">レアル・マドリード</span>の下部組織で育ったセンターバック兼左サイドバック。</div><div class=\"list-item\"><span class=\"team-name\">アヤックス</span>（オランダ・エールディヴィジ）：フリーの<span class=\"player-name\">ユリアン・ブラント</span>(30歳・ドイツ代表)がフリートランスファーで加入。<span class=\"team-name\">ボルシア・ドルトムント</span>を退団していた攻撃的MF。</div><div class=\"list-item\"><span class=\"team-name\">ル・アーヴル</span>（リーグ・アン）：<span class=\"team-name\">ウェストブロムウィッチ・アルビオン</span>（イングランド2部）より<span class=\"player-name\">ジョシュ・マジャ</span>(27歳・ナイジェリア代表)がフリートランスファーで加入。</div><div class=\"list-item\"><span class=\"team-name\">ジェノア</span>（セリエA）：<span class=\"team-name\">アル・イテハド</span>（サウジ・プロリーグ）より<span class=\"player-name\">マリオ・ミタイ</span>(22歳・アルバニア代表)が期限付き移籍で加入。レンタル料は約200万ユーロ。</div><div class=\"list-item\"><span class=\"team-name\">エユプスポル</span>（トルコ・スュペルリグ）：<span class=\"team-name\">フィオレンティーナ</span>（セリエA）より<span class=\"player-name\">アブデルハミド・サビリ</span>(29歳・モロッコ代表)が期限付き移籍で加入。</div><div class=\"list-item\"><span class=\"team-name\">ジェフユナイテッド千葉</span>（J1）：<span class=\"team-name\">水戸ホーリーホック</span>（J1）よりDF<span class=\"player-name\">飯田貴敬</span>(31歳)が完全移籍で加入。背番号は22。攻撃参加を武器とする右サイドバックで、清水・京都などを経て2025年に加入した<span class=\"team-name\">水戸ホーリーホック</span>ではクラブ初のJ1昇格に大きく貢献していた。開幕1週間前の緊急補強となる。</div><div class=\"list-item\"><span class=\"team-name\">アルビレックス新潟</span>（J2）：<span class=\"team-name\">コリチーバFC</span>（ブラジル）よりFW<span class=\"player-name\">イウリ・カスティーリョ</span>(30歳)が完全移籍で加入。8月1日にチーム合流予定。2020年に<span class=\"team-name\">レノファ山口FC</span>でJ2・31試合9得点を記録して以来、約5年半ぶりのJリーグ復帰となる。</div><div class=\"list-item\"><span class=\"team-name\">PSSスレマン</span>（インドネシア・スーパーリーグ）：<span class=\"team-name\">北海道コンサドーレ札幌</span>（J2）よりMF<span class=\"player-name\">田中宏武</span>(27歳)が完全移籍で加入。立正大から2022年に<span class=\"team-name\">北海道コンサドーレ札幌</span>へ入団し、2023年には<span class=\"team-name\">藤枝MYFC</span>への期限付き移籍も経験していた。</div><div class=\"list-item\"><span class=\"team-name\">RBライプツィヒU19</span>（ドイツ）：<span class=\"team-name\">RB大宮アルディージャ</span>（J2）よりMF<span class=\"player-name\">神田泰斗</span>(18歳)が期限付き移籍で加入。期限は2027年6月30日まで。<span class=\"team-name\">RB大宮アルディージャ</span>の下部組織出身で2025年にトップチーム昇格を果たしたばかりの逸材が、レッドブル・グループのネットワークを通じてドイツへ渡る。</div><div class=\"list-item\"><span class=\"team-name\">V・ファーレン長崎</span>（J1）：FW<span class=\"player-name\">ジョップ・セリンサリウ</span>(23歳)の<span class=\"team-name\">福山シティフットボールクラブ</span>への育成型期限付き移籍を延長。</div>",

<script>
function toggleMatch(el) {
  const detail = el.parentElement.querySelector('.match-detail');
  if (detail) detail.classList.toggle('show');
}

const DAYS = JSON.parse(document.getElementById('archive-data').textContent);
let activeIndex = 0;

const READ_KEY = 'soccerNewsReadDates';
function getReadDates() {
  try {
    return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]'));
  } catch (e) {
    return new Set();
  }
}
function markDateRead(date) {
  const read = getReadDates();
  if (!read.has(date)) {
    read.add(date);
    localStorage.setItem(READ_KEY, JSON.stringify([...read]));
  }
}

function renderSidebar() {
  const list = document.getElementById('archive-list');
  const readDates = getReadDates();
  list.innerHTML = DAYS.map((d, i) => {
    const isUnread = !readDates.has(d.date);
    const dot = isUnread ? '<span class="archive-unread-dot" title="未読"></span>' : '';
    return `<div class="archive-item${i === activeIndex ? ' active' : ''}" onclick="showDay(${i})">${dot}<span>${d.label}</span></div>`;
  }).join('');
}

function showDay(idx) {
  activeIndex = idx;
  const d = DAYS[idx];
  document.getElementById('period-label').textContent = d.period;
  document.getElementById('updated-line').textContent = '最終更新: ' + d.updated;
  document.getElementById('results-body').innerHTML = d.resultsHtml;
  document.getElementById('standings-body').innerHTML = d.standingsHtml;
  document.getElementById('transfers-body').innerHTML = d.transfersHtml;
  document.getElementById('goals-body').innerHTML = d.goalsHtml;
  markDateRead(d.date);
  renderSidebar();
}

showDay(0);

// ---- CHAT ----
const CHAT_WORKER_URL = 'https://soccer-chat-proxy.y-furuya0109.workers.dev';
const chatHistory = [];

function escChat(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function appendChatMessage(role, text, sources) {
  const wrap = document.getElementById('chat-messages');
  wrap.classList.add('show');
  const el = document.createElement('div');
  el.className = 'chat-msg ' + role;
  el.textContent = text;
  if (sources && sources.length) {
    const srcWrap = document.createElement('div');
    srcWrap.className = 'chat-sources';
    sources.slice(0, 4).forEach(s => {
      const a = document.createElement('a');
      a.href = s.uri; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '↗ ' + (s.title || s.uri);
      srcWrap.appendChild(a);
    });
    el.appendChild(srcWrap);
  }
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
  return el;
}

document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  const text = input.value.trim();
  if (!text) return;

  appendChatMessage('user', text);
  chatHistory.push({ role: 'user', text });
  input.value = '';
  input.disabled = true;
  btn.disabled = true;

  const pending = appendChatMessage('assistant pending', '考え中…');

  try {
    const res = await fetch(CHAT_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: chatHistory.slice(0, -1) }),
    });
    const data = await res.json();
    pending.remove();
    if (!res.ok || data.error) {
      appendChatMessage('assistant', '(エラーが発生しました。しばらくしてからもう一度お試しください)');
    } else {
      appendChatMessage('assistant', data.reply || '(応答がありませんでした)', data.sources);
      chatHistory.push({ role: 'assistant', text: data.reply || '' });
    }
  } catch (err) {
    pending.remove();
    appendChatMessage('assistant', '(通信エラーが発生しました)');
  } finally {
    input.disabled = false;
    btn.disabled = false;
    input.focus();
  }
});
</script>
